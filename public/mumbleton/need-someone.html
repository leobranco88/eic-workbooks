<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>I need someone</title>
<style>
@font-face{font-family:K;src:url(fonts/kalam-400.woff2) format('woff2');font-weight:400}
@font-face{font-family:K;src:url(fonts/kalam-700.woff2) format('woff2');font-weight:700}
@font-face{font-family:PS;src:url(fonts/ps-400.woff2) format('woff2');font-weight:400}
@font-face{font-family:PS;src:url(fonts/ps-600.woff2) format('woff2');font-weight:600}
:root{--wall:#2f5f5c;--deep:#234846;--cream:#f3e6c8;--hl:#f4dd8a;--ink:#1e1b1a;--terra:#b44f33;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--wall);color:var(--cream);font:400 18px/1.4 PS,Georgia,serif;
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);overflow-x:hidden}
body::before{content:"";position:fixed;left:0;right:0;bottom:0;top:-34vh;background:url(img/ui/wall-a.webp) 50% 100%/cover no-repeat;z-index:-1}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.app{height:100vh;height:100dvh;min-height:560px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr)}
main{display:flex;align-items:flex-end;min-height:0}

/* top: the sentence the teacher says, with the blank filled by the chosen quality */
.top{display:grid;grid-template-columns:minmax(0,1fr) clamp(220px,24vw,330px);gap:clamp(20px,4vw,64px);
  padding:clamp(18px,3.4vh,40px) clamp(20px,4vw,56px) 0}
.say small{display:block;font:700 12px/1 K;letter-spacing:.2em;text-transform:uppercase;color:var(--hl);margin-bottom:clamp(8px,1.6vh,16px)}
.say h1{font:700 clamp(30px,5vw,76px)/1.02 K;color:var(--cream)}
.say h1 .w{display:inline-block;min-width:3.2ch;color:var(--ink);padding:0 .18em;margin:0 .04em;
  background:url(img/ui/tape.webp) 0 82%/100% 58% no-repeat;transition:opacity .2s}
.say h1 .w.empty{color:transparent;filter:opacity(.55);background-position:0 70%;background-size:100% 72%}
.who{margin-top:clamp(10px,2vh,22px);min-height:3.2em}
.who b{font:700 clamp(18px,2.2vw,30px)/1.2 K;color:var(--hl);display:block}
.who span{font:italic 400 clamp(16px,1.7vw,24px)/1.3 PS;color:var(--cream)}

/* the six qualities: plain words on a ruled list */
.q{list-style:none;align-self:start}
.q li+li{border-top:1px dashed #f3e6c855}
.q button{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:clamp(5px,1.1vh,11px) 6px;
  font:700 clamp(22px,2.6vw,36px)/1.1 K;min-height:44px;border-radius:2px}
.q img{width:clamp(24px,2.4vw,34px);height:auto;flex:none;border-radius:4px;background:var(--cream);padding:2px}
.q button .n{margin-left:auto;font:400 12px/1 PS;color:#f3e6c88c;letter-spacing:.1em}
.q button[aria-pressed=true]{color:var(--ink);background:url(img/ui/tape.webp) 0 0/100% 100% no-repeat}
.q button[aria-pressed=true] .n{color:#1e1b1a99}
.q button:focus-visible,.line button:focus-visible{outline:3px solid var(--hl);outline-offset:3px}

/* lineup: the eight apprentices */
.line{width:100%;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:clamp(2px,.8vw,14px);
  padding:0 clamp(10px,3vw,48px);margin-top:clamp(8px,2vh,24px);border-bottom:6px solid #f3e6c8;position:relative}
.line li{list-style:none;position:relative;min-width:0}
.line button{display:block;width:100%;position:relative;padding-top:0}
.line img{display:block;width:100%;height:clamp(130px,33vh,420px);object-fit:contain;object-position:bottom;transform-origin:50% 100%;transform:scale(var(--k,1));
  transition:transform .35s cubic-bezier(.2,.8,.3,1),filter .3s,opacity .3s}
.nm{display:block;position:absolute;left:0;right:0;bottom:-3px;transform:translateY(100%);text-align:center;
  font:700 clamp(12px,1.35vw,20px)/1 K;padding-top:10px;color:var(--cream)}
.line{margin-bottom:clamp(30px,4.4vh,50px)}

/* states */
.line li.lit img{transform:translateY(-14px) scale(calc(1.05*var(--k,1)))}
.line li.lit .nm{color:var(--ink);background:url(img/ui/tape.webp) 0 0/100% 100% no-repeat;padding:7px 4px 6px;margin-top:6px}
.line li.mid img{filter:grayscale(1) brightness(.75);opacity:.38}
.line li.vol img{opacity:.9;filter:saturate(.8)}
.line li.vol .nm::after{content:" (maybe?)";font-weight:400;font-style:italic;font-family:PS}
.line.pick li:not(.chosen) img{opacity:.3;filter:grayscale(.7)}
.line.pick li.chosen img{opacity:1;filter:none;transform:translateY(-22px) scale(calc(1.1*var(--k,1)))}

/* funny line from a volunteer, appears with a delay so the room can laugh */
.bub{position:absolute;left:50%;bottom:calc(100% - 4px);transform:translate(-50%,6px) scale(.96);
  width:max(130%,150px);max-width:210px;background:none;filter:drop-shadow(0 4px 5px #0007);color:var(--ink);font:700 clamp(12px,1.25vw,17px)/1.25 K;
  padding:11px 16px 16px;text-align:left;opacity:0;pointer-events:none;
  transition:opacity .25s,transform .25s;z-index:3}
.bub::before{content:"";position:absolute;inset:0;z-index:-1;background:url(img/ui/bubble-body.webp) 0 0/100% 100% no-repeat}
/* the tail is its own piece so it can point at whoever is speaking */
.bub::after{content:"";position:absolute;left:var(--tx,50%);top:calc(100% - 9px);width:26px;height:var(--th,22px);transform:translateX(-50%);z-index:-2;background:url(img/ui/tail.webp) 0 0/100% 100% no-repeat}
.line li:nth-child(-n+2) .bub{--tx:38%}
.line li:nth-child(n+7) .bub{--tx:62%}
.line li.up .bub{--th:84px}
.line li:nth-child(5) .bub{bottom:calc(100% + 14px)}
.bub.show{opacity:1;transform:translate(-50%,0) scale(1)}
.line li.up .bub{bottom:calc(100% + 62px)}
.line li:nth-child(1) .bub,.line li:nth-child(2) .bub{left:0;transform:translate(0,6px) scale(.96)}
.line li:nth-child(1) .bub.show,.line li:nth-child(2) .bub.show{transform:translate(0,0)}
.line li:nth-child(n+7) .bub{left:auto;right:0;transform:translate(0,6px) scale(.96);border-radius:12px 12px 2px 12px}
.line li:nth-child(n+7) .bub.show{transform:translate(0,0)}

.empty-note{position:absolute;left:0;right:0;top:35%;text-align:center;font:italic 400 clamp(16px,1.8vw,24px)/1.3 PS;color:#f3e6c8b0;pointer-events:none}
.foot{display:flex;justify-content:space-between;gap:12px;padding:0 clamp(20px,4vw,56px) 14px;font:700 11px/1 K;letter-spacing:.18em;text-transform:uppercase;color:#f3e6c880}
.foot button{font:inherit;letter-spacing:inherit;text-transform:inherit;color:#f3e6c8b0;text-decoration:underline;text-underline-offset:3px;min-height:32px}

@media (max-width:760px){
  .top{grid-template-columns:minmax(0,1fr)}
  .q{display:grid;grid-template-columns:1fr 1fr;column-gap:12px}
  .q li+li{border-top:0}.q li{border-top:1px dashed #f3e6c855}
  .q button{font-size:22px}
  .q button .n{display:none}
  .line{grid-template-columns:repeat(4,minmax(0,1fr));row-gap:34px}
  .line img{height:clamp(120px,22vh,200px)}
  .app{height:auto;min-height:100dvh}
  .line li.up .bub{bottom:calc(100% - 4px)}
  .bub{bottom:calc(100% - 4px)}
  .line li:nth-child(4n+1) .bub{left:0;right:auto;transform:translate(0,6px)}
  .line li:nth-child(4n+1) .bub.show{transform:none}
  .line li:nth-child(4n) .bub,.line li:nth-child(4n+3) .bub{left:auto;right:0;transform:translate(0,6px)}
  .line li:nth-child(4n) .bub.show,.line li:nth-child(4n+3) .bub.show{transform:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="say">
      <small>Teacher says</small>
      <h1 id="sent">I need someone <span class="w empty" id="w">brave</span>.</h1>
      <div class="who" id="who" aria-live="polite"></div>
    </div>
    <ul class="q" id="q"></ul>
  </header>
  <main>
    <ul class="line" id="line"></ul>
  </main>
  <footer class="foot"><span>Mumbleton Academy · Class mode</span><button id="reset" type="button">Start again</button></footer>
</div>
<script>
const Q=['Curious','Careful','Patient','Kind','Brave','Playful'];
/* points per quality, same order as the card backs */
const A=[
 {k:'juno',n:'Juno',img:'stand_juno',p:[3,1,1,2,2,3],r:{0:'Juno asks the first question.',5:'Juno turns it into a game.',1:'Juno starts… then has a new idea.',2:'Juno writes it on a sticky note. Then she loses the note.'},b:{1:'I start… oh, wait! A new idea!',2:'I write it on a sticky note. Then I lose the note.'}},
 {k:'kai',n:'Kai',img:'stand_kai',p:[3,3,1,2,2,1],r:{0:'Kai looks closely and asks why.',1:'Kai checks. Then checks again.',2:'Kai waits… then checks the clock.',5:'Kai plays. But first, one more check.'},b:{2:'I wait… and I check the clock.',5:'I play. But first, one more check.'}},
 {k:'pim',n:'Pim',img:'stand_pim',p:[1,3,2,3,1,2],r:{0:'Pim looks. From behind the chair.',1:'Pim checks everything first.',3:'Pim helps a friend.',4:'Pim finds his light. Then one small step.'},b:{0:'I look. From behind the chair.',4:'I find my light. Then one small step.'}},
 {k:'odette',n:'Odette',img:'stand_odette',p:[2,3,3,1,1,2],r:{1:'Odette checks every detail.',2:'Odette waits for her turn.',3:'Odette helps… after this page.',4:'Odette is brave. After she reads it again.'},b:{3:'I help… after this page.',4:'I am brave. After I read it again.'}},
 {k:'rafa',n:'Rafa',img:'rafa_stand',p:[1,1,1,3,3,3],r:{3:'Rafa helps a friend.',4:'Rafa stands up first.',5:'Rafa makes it a game.',0:'Rafa has a question. Actually, an answer!',1:'Rafa is careful. Oops!',2:'Rafa waits… for two seconds.'},b:{0:'I have a question. Actually, an answer!',1:'I am careful. Oops!',2:'I wait… for two seconds.'}},
 {k:'mina',n:'Mina',img:'stand_mina',p:[2,2,2,3,2,1],r:{3:'Mina checks that everybody is safe.',5:'Mina makes a plan for the game.'},b:{5:'I make a plan for the game.'}},
 {k:'theo',n:'Theo',img:'stand_theo',p:[1,1,3,2,2,3],r:{2:'Theo waits as long as it takes.',5:'Theo starts a game.',0:'Theo asks one question. Then he yawns.',1:'Theo is careful. Tomorrow.'},b:{0:'I have one question… (yawn)',1:'I am careful. Tomorrow.'}},
 {k:'zuri',n:'Zuri',img:'stand_zuri',p:[2,1,1,2,3,3],r:{4:'Zuri goes on stage first.',5:'Zuri makes it a show.',1:'Zuri checks her hat. Not the answer.',2:'Zuri waits… and claps first.'},b:{1:'I check my hat. And my mirror.',2:'I wait… and I clap first.'}}
];
const $=id=>document.getElementById(id);
const qEl=$('q'),line=$('line'),w=$('w'),who=$('who');
let cur=-1,chosen=-1,timers=[];

Q.forEach((q,i)=>{
  const li=document.createElement('li');
  li.innerHTML='<button type="button" aria-pressed="false"><img src="img/icon_'+q.toLowerCase()+'.png" alt=""><span>'+q+'</span><span class="n">'+(i+1)+'</span></button>';
  li.firstChild.onclick=()=>pick(i);qEl.appendChild(li)
});
A.forEach((a,i)=>{
  const li=document.createElement('li');
  if(a.k==='rafa')li.style.setProperty('--k','1.09');
  li.innerHTML='<button type="button" aria-label="'+a.n+'"><img src="img/room/'+a.img+'.webp" alt="'+a.n+'"><span class="nm">'+a.n+'</span></button><div class="bub" role="status"></div>';
  li.querySelector('button').onclick=()=>choose(i);line.appendChild(li)
});
const lis=[...line.children];

function clearT(){timers.forEach(clearTimeout);timers=[]}
function pick(i){
  clearT();chosen=-1;line.classList.remove('pick');
  if(cur===i){return reset()}
  cur=i;
  [...qEl.querySelectorAll('button')].forEach((b,j)=>b.setAttribute('aria-pressed',j===i));
  w.textContent=Q[i].toLowerCase();w.classList.remove('empty');
  who.innerHTML='<span>Who is '+Q[i].toLowerCase()+' today?</span>';
  let v=0;
  A.forEach((a,j)=>{
    const li=lis[j],b=li.querySelector('.bub'),p=a.p[i];
    li.className=p===3?'lit':p===1?'vol':'mid';
    if(p===1&&j>0&&A[j-1].p[i]===1)li.classList.add('up');
    b.classList.remove('show');
    if(p===1){b.textContent=(a.b&&a.b[i])||'Um… maybe me?';timers.push(setTimeout(()=>b.classList.add('show'),900+v*500));v++}
  });
}
function choose(j){
  if(cur<0)return;
  const a=A[j],p=a.p[cur];
  if(p===2)return;
  chosen=j;line.classList.add('pick');
  lis.forEach((li,k)=>li.classList.toggle('chosen',k===j));
  lis.forEach(li=>li.querySelector('.bub').classList.remove('show'));
  who.innerHTML='<b>'+a.n+'</b><span>'+(a.r[cur]||'')+'</span>';
}
function reset(){
  clearT();cur=-1;chosen=-1;line.classList.remove('pick');
  [...qEl.querySelectorAll('button')].forEach(b=>b.setAttribute('aria-pressed','false'));
  w.textContent='brave';w.classList.add('empty');who.innerHTML='<span>Tap a quality to see who raises a hand.</span>';
  lis.forEach(li=>{li.className='';li.querySelector('.bub').classList.remove('show')});
}
$('reset').onclick=reset;
addEventListener('keydown',e=>{const n=+e.key;if(n>=1&&n<=6)pick(n-1);if(e.key==='Escape')reset()});
reset();
</script>
</body>
</html>
