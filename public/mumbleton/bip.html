<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Today I am</title>
<style>
@font-face{font-family:K;src:url(fonts/kalam-400.woff2) format('woff2');font-weight:400}
@font-face{font-family:K;src:url(fonts/kalam-700.woff2) format('woff2');font-weight:700}
@font-face{font-family:PS;src:url(fonts/ps-400.woff2) format('woff2');font-weight:400}
@font-face{font-family:PS;src:url(fonts/ps-600.woff2) format('woff2');font-weight:600}
:root{--wall:#2f5f5c;--deep:#183837;--cream:#f3e6c8;--hl:#f4dd8a;--ink:#1e1b1a;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--deep);color:var(--cream);font:400 18px/1.4 PS,Georgia,serif;overflow:hidden;
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.stage{position:fixed;inset:0}

/* idle: waiting for a card */
.idle{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;
  background:var(--wall) url(img/ui/reader.webp) left center/cover no-repeat;transition:opacity .5s,visibility .5s}
.idle>div{margin-left:36%}
.idle h1{font:700 clamp(44px,9vw,132px)/.98 K;color:var(--cream)}
.idle h1 em{font-style:normal;color:var(--ink);background:linear-gradient(transparent 52%,var(--hl) 52%);padding:0 .14em}
.idle p{font:italic 400 clamp(17px,2vw,28px)/1.35 PS;margin-top:clamp(14px,3vh,34px);color:#f3e6c8cc}
.idle .ln{width:min(520px,70vw);height:6px;background:var(--cream);margin:clamp(20px,4vh,44px) auto 0;border-radius:1px;transform-origin:left;animation:wait 2.4s ease-in-out infinite}
@keyframes wait{0%,100%{transform:scaleX(.18)}50%{transform:scaleX(1)}}
body.on .idle{opacity:0;visibility:hidden}

/* the apprentice, full screen */
.ap{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,44%) minmax(0,1fr);grid-template-rows:minmax(0,1fr);opacity:0;visibility:hidden;transition:opacity .45s}
body.on .ap{opacity:1;visibility:visible}
.bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:saturate(.9)}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#183837cc 0,#183837f2 46%,#183837f7 100%)}
.fig{position:relative;align-self:end;height:100%;display:flex;align-items:flex-end;justify-content:center;padding:4vh 0 0}
.fig img{height:94%;max-height:100%;max-width:100%;object-fit:contain;object-position:bottom;transform-origin:50% 100%;
  animation:rise .7s cubic-bezier(.2,.8,.3,1) both}
@keyframes rise{from{transform:translateY(5%) scale(.97);opacity:0}to{transform:none;opacity:1}}
.txt{position:relative;align-self:center;padding:clamp(14px,3vh,48px) clamp(22px,5vw,84px) clamp(54px,9vh,80px) 0;min-width:0}
.k{font:700 clamp(13px,1.4vw,20px)/1.2 K;letter-spacing:.2em;text-transform:uppercase;color:var(--hl)}
.nm{font:700 clamp(56px,min(11vw,21vh),190px)/.9 K;color:var(--cream);margin:.04em 0 0;letter-spacing:-.01em}
.say{display:inline-block;margin-top:clamp(12px,2.6vh,30px);font:700 clamp(26px,min(4.2vw,8vh),68px)/1.08 K;color:var(--ink);
  background:url(img/ui/tape.webp) 0 0/100% 100% no-repeat;padding:.12em .42em .18em}
.ph{list-style:none;margin-top:clamp(16px,3.4vh,40px);max-width:760px}
.ph li{display:flex;justify-content:space-between;align-items:baseline;gap:18px;padding:clamp(5px,1vh,10px) 0;border-bottom:1px dashed #f3e6c855}
.ph b{font:700 clamp(19px,min(2.3vw,4.2vh),34px)/1.15 K}
.ph span{font:italic 400 clamp(13px,1.2vw,17px)/1.2 PS;color:#f3e6c8aa;text-align:right}
.tr{margin-top:clamp(14px,3vh,34px);font:600 clamp(15px,1.5vw,21px)/1.35 PS;max-width:760px;color:#f3e6c8e6}
.tr small{display:block;font:700 clamp(11px,1vw,14px)/1 K;letter-spacing:.2em;text-transform:uppercase;color:var(--hl);margin-bottom:6px}

/* visit the apprentice's room in the portal */
.visit{display:inline-block;margin-top:clamp(12px,2.4vh,26px);font:700 clamp(15px,1.5vw,21px)/1 K;color:var(--ink);text-decoration:none;
  padding:.8em 1.4em .9em;background:url(img/ui/bubble.webp) 0 0/100% 100% no-repeat;filter:drop-shadow(0 4px 5px #0007);min-height:44px}
.visit:hover,.visit:focus-visible{transform:translateY(-2px);outline:none}
/* teacher controls: small, out of the way */
.ctl{position:fixed;right:clamp(12px,2vw,28px);bottom:clamp(10px,2vh,22px);display:flex;gap:6px;z-index:5}
.ctl button{font:700 11px/1 K;letter-spacing:.16em;text-transform:uppercase;color:#f3e6c8b8;padding:10px 12px;min-height:40px;
  border:1px solid #f3e6c866;border-radius:2px;background:#18383799}
.ctl button:hover,.ctl button:focus-visible{color:var(--ink);background:var(--hl);outline:none}
.tray{position:fixed;right:clamp(12px,2vw,28px);bottom:calc(clamp(10px,2vh,22px) + 50px);width:min(420px,calc(100vw - 24px));z-index:6;
  background:var(--cream);color:var(--ink);padding:14px 16px 16px;border-radius:3px;box-shadow:0 14px 40px #0008;display:none}
.tray.open{display:block}
.tray h2{font:700 12px/1 K;letter-spacing:.18em;text-transform:uppercase;color:#6a5a2a;margin-bottom:8px}
.tray h2:not(:first-child){margin-top:14px}
.tray p{font:italic 400 14px/1.3 PS;color:#4b4430;margin-bottom:8px}
.row{display:flex;flex-wrap:wrap;gap:6px}
.row button{font:700 16px/1 K;padding:9px 12px;min-height:40px;border:2px solid var(--ink);border-radius:2px;color:var(--ink)}
.row button:hover,.row button:focus-visible{background:var(--ink);color:var(--cream);outline:none}
.row button i{font:400 11px/1 PS;font-style:normal;opacity:.7;margin-left:6px}
.tray .reset{margin-top:12px;font:400 13px/1 PS;text-decoration:underline;color:#4b4430;min-height:32px}

@media (max-width:820px){
  body{overflow:auto}
  .stage{position:relative;min-height:100dvh}
  .ap{position:relative;min-height:100dvh;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto}
  .nm{font-size:clamp(64px,22vw,120px)}
  .idle{position:fixed;background-position:18% 0;background-size:auto 62%}
  .idle>div{margin:52vh 0 0}
  .fig{height:44vh}.fig img{height:100%}
  .txt{padding:0 20px 90px}
  .nm{font-size:clamp(64px,22vw,120px)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="stage">
  <section class="idle" id="idle">
    <div>
      <h1>Today I am</h1>
      <div class="ln" aria-hidden="true"></div>
      <p>Hold your card under the reader.</p>
    </div>
  </section>
  <section class="ap" id="ap" aria-live="polite">
    <div class="bg" id="bg"></div>
    <div class="fig"><img id="fig" alt=""></div>
    <div class="txt">
      <div class="k" id="who"></div>
      <h2 class="nm" id="nm"></h2>
      <div class="say" id="say"></div>
      <ul class="ph" id="ph"></ul>
      <div class="tr" id="tr"></div>
      <a class="visit" id="visit" href="#" target="_blank" rel="noopener"></a>
    </div>
  </section>
</div>
<div class="tray" id="tray">
  <h2>Pretend a student bips</h2>
  <p>Each test card keeps its apprentice, just like a real card would.</p>
  <div class="row" id="stud"></div>
  <h2>Or show any apprentice</h2>
  <div class="row" id="any"></div>
  <button class="reset" id="reset" type="button">Reset the test cards</button>
</div>
<div class="ctl"><button id="test" type="button" aria-expanded="false">Test</button><button id="back" type="button">Next student</button></div>
<script>
/* where the portal lives: change this one line when the portal has its final address */
const PORTAL='portal.html';
const AP=[{"k": "juno", "no": "01", "n": "Juno", "say": "Wait, I have an idea.", "one": "Juno has ten ideas, and forgets the first.", "ph": [["Wait, I have an idea.", "every single time"], ["What if we…?", "curious"], ["Ooh, what is that?", "curious"], ["Let’s make it a game!", "playful"], ["Oops, what was I doing?", "she forgets"], ["I have ten ideas!", "always"]], "tq": "Patient", "tt": "I write my idea on a sticky note. Then I can go back to it.", "why": "She makes a boring moment fun with one new idea.", "wrong": ["Scatterbrained.", "Too many ideas."]}, {"k": "kai", "no": "02", "n": "Kai", "say": "Let me check.", "one": "Kai checks everything, and checks again.", "ph": [["Let me check.", "every single time"], ["Wait, let me check again.", "careful"], ["Is the list complete?", "careful"], ["I will look closely.", "curious"], ["One more time, please.", "he asks for it twice"], ["Almost done!", "always the last one"]], "tq": "Playful", "tt": "I check one time. Then I do something fun.", "why": "He keeps everybody’s ideas safe. Nothing gets lost.", "wrong": ["Slow.", "Checks it all again."]}, {"k": "pim", "no": "03", "n": "Pim", "say": "Is it safe?", "one": "Pim is kind and careful, and is afraid of the dark.", "ph": [["Is it safe?", "every single time"], ["Can we turn on the light?", "he is afraid of the dark"], ["Careful, it is hot.", "careful"], ["I will help you.", "kind"], ["One small step. Then another.", "brave, a little"], ["Okay… I am ready.", "after the light is on"]], "tq": "Brave", "tt": "I take my night light. Then I take one small step.", "why": "He notices when a friend feels scared. He stays with them.", "wrong": ["Fearful.", "Sees danger everywhere."]}, {"k": "odette", "no": "04", "n": "Odette", "say": "Read it again.", "one": "Odette is sure about everything, and never changes her mind.", "ph": [["Read it again.", "every single time"], ["I have not changed my mind.", "she is sure"], ["I am sure.", "always"], ["Please, no talking.", "she is reading"], ["Let me finish this page.", "patient"], ["I can wait.", "patient"]], "tq": "Kind", "tt": "I listen to one more idea before I decide.", "why": "She finishes what she starts. You can trust her answer.", "wrong": ["Stubborn.", "Never lets go of a detail."]}, {"k": "rafa", "no": "05", "n": "Rafa", "say": "I’ll go first!", "one": "Rafa always goes first, and thinks later.", "ph": [["I’ll go first!", "every single time"], ["Let me try!", "before the teacher finishes"], ["Easy! Watch this.", "brave"], ["Come on, you can do it!", "kind"], ["Oops! Again!", "playful"], ["Is it my turn yet?", "he cannot wait"]], "tq": "Careful", "tt": "I count to three before I push the button.", "why": "He makes shy friends brave. He says, “Come on, you can do it!”", "wrong": ["Reckless.", "Jumps in before thinking."]}, {"k": "mina", "no": "06", "n": "Mina", "say": "Trust me.", "one": "Mina has a plan for everything, and cannot let anyone else lead.", "ph": [["Trust me.", "every single time"], ["I have a plan.", "always"], ["Everybody, line up!", "she leads"], ["Is everybody OK?", "kind"], ["Let me lead.", "she cannot let go"], ["Good job, team!", "kind"]], "tq": "Playful", "tt": "I let a friend choose the game. Then I join the fun.", "why": "She makes sure nobody is left out. Everybody gets a job.", "wrong": ["Bossy.", "Decides for everybody."]}, {"k": "theo", "no": "07", "n": "Theo", "say": "Just five more minutes.", "one": "Theo can wait for anything, and cannot wake up on time.", "ph": [["Just five more minutes.", "every single time"], ["No rush.", "patient"], ["I am in no hurry.", "patient"], ["Let’s play one more round!", "playful"], ["Is it morning yet?", "he is sleepy"], ["It is breakfast.", "pancakes at ten"]], "tq": "Careful", "tt": "I set an alarm and I put my bag by the door.", "why": "He never rushes anybody. With Theo, there is always time.", "wrong": ["Lazy.", "Always five more minutes."]}, {"k": "zuri", "no": "08", "n": "Zuri", "say": "Watch this!", "one": "Zuri turns everything into a show, and cannot do it without an audience.", "ph": [["Watch this!", "every single time"], ["Everybody, watch!", "she needs an audience"], ["Go, go, go! You can do it!", "she cheers for friends"], ["Ta-da!", "brave"], ["Do it again!", "playful"], ["Is everybody watching?", "always"]], "tq": "Patient", "tt": "I wait for my turn. I clap for my friends first.", "why": "She makes her friends feel like stars. She claps first and cheers the loudest.", "wrong": ["Show-off.", "A little too much show."]}];
const ROSTER={'100001':'Ana','100002':'Bia','100003':'Caio','100004':'Duda','100005':'Enzo','100006':'Lia'};
const $=id=>document.getElementById(id);
const room=k=>'img/room/'+(k==='pim'?'pim_bedroom':k+'_room')+'.webp';
const stand=k=>'img/room/'+(k==='rafa'?'rafa_stand':'stand_'+k)+'.webp';
let store={};try{store=JSON.parse(localStorage.getItem('mumb_class')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('mumb_class',JSON.stringify(store))}catch(e){}};
let snd=null;try{snd=new Audio('snd/bipe.mp3')}catch(e){}
const beep=()=>{try{snd&&(snd.currentTime=0,snd.play().catch(()=>{}))}catch(e){}};

/* a card keeps the same apprentice; a new card gets one nobody else holds yet */
function apFor(code){
  if(store[code]===undefined){
    const used=Object.values(store),free=AP.map((_,i)=>i).filter(i=>!used.includes(i));
    const pool=free.length?free:AP.map((_,i)=>i);
    store[code]=pool[Math.floor(Math.random()*pool.length)];save();
  }
  return store[code];
}
function show(i,name){
  const a=AP[i];
  $('bg').style.backgroundImage='url('+room(a.k)+')';
  const f=$('fig');f.style.animation='none';void f.offsetWidth;f.style.animation='';
  f.src=stand(a.k);f.alt=a.n;
  f.style.scale=a.k==='rafa'?'1.09':'1';
  $('who').textContent=(name?name+', t':'T')+'oday you are';
  $('nm').textContent=a.n;
  $('say').textContent=a.say;
  $('ph').innerHTML=a.ph.slice(1,5).map(p=>'<li><b>'+p[0]+'</b><span>'+p[1]+'</span></li>').join('');
  $('tr').innerHTML='<small>Your trick · '+a.tq+'</small>“'+a.tt+'”';
  const v=$('visit');v.textContent='Visit '+a.n+'’s room';v.href=PORTAL+'#'+a.k;
  document.body.classList.add('on');
}
function scan(code){code=String(code).trim();const name=ROSTER[code];beep();show(apFor(code),name||'')}
function back(){document.body.classList.remove('on');$('tray').classList.remove('open');$('test').setAttribute('aria-expanded','false')}

/* the reader types digits and Enter, like the Last Bell reader */
let buf='',last=0;
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  const t=Date.now();if(t-last>400)buf='';last=t;
  if(e.key==='Enter'){if(buf.length>=4)scan(buf);buf='';return}
  if(/^\d$/.test(e.key))buf+=e.key;
  if(e.key==='Escape')back();
});

/* test tray */
$('stud').innerHTML=Object.entries(ROSTER).map(([c,n])=>'<button type="button" data-c="'+c+'">'+n+'<i>'+c+'</i></button>').join('');
$('any').innerHTML=AP.map((a,i)=>'<button type="button" data-i="'+i+'">'+a.n+'</button>').join('');
$('stud').onclick=e=>{const b=e.target.closest('button');if(b){scan(b.dataset.c);$('tray').classList.remove('open');$('test').setAttribute('aria-expanded','false')}};
$('any').onclick=e=>{const b=e.target.closest('button');if(b){beep();show(+b.dataset.i,'');$('tray').classList.remove('open');$('test').setAttribute('aria-expanded','false')}};
$('test').onclick=()=>{const o=$('tray').classList.toggle('open');$('test').setAttribute('aria-expanded',o)};
$('back').onclick=back;
$('reset').onclick=()=>{store={};save();back()};
</script>
</body>
</html>
