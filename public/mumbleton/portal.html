<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mumbleton Academy · Apprentice rooms</title>
<style>
@font-face{font-family:K;src:url(fonts/kalam-400.woff2) format('woff2');font-weight:400}
@font-face{font-family:K;src:url(fonts/kalam-700.woff2) format('woff2');font-weight:700}
:root{--dk:92px;--cream:#f3e6c8;--ink:#1e1b1a;--mus:#e6a923;--terra:#b44f33;--teal:#2f5f5c;--hl:#f4dd8a}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:#142a2a;color:var(--cream);font:400 18px/1.4 K,system-ui,sans-serif;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}
button{font:inherit;color:inherit;cursor:pointer}
.stage{position:relative;width:min(100vw,calc((100vh - var(--dk))*1.7778));aspect-ratio:16/9;background:#142a2a center/100% 100% no-repeat;overflow:hidden}

/* ribbon title + counter */
.title{position:absolute;left:1.6%;top:1.8%;z-index:3;text-align:center;background:url(img/ui/k_ribbon.webp) center/100% 100% no-repeat;padding:clamp(12px,2.2vh,22px) clamp(50px,6vw,84px) clamp(14px,2.4vh,26px);color:var(--ink);filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}
.title small{display:block;font:700 clamp(10px,1vw,13px)/1 K;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.title b{font:700 clamp(20px,2.6vw,36px)/1.1 K}
.meter{position:absolute;right:2.4%;top:3%;z-index:3;text-align:right;text-shadow:0 2px 6px rgba(0,0,0,.7)}
.meter small{display:block;font:700 clamp(10px,1vw,13px)/1 K;letter-spacing:.14em;text-transform:uppercase}
.meter b{font:700 clamp(22px,2.6vw,36px)/1.1 K}

/* Rafa */
.rafa{position:absolute;left:var(--sx,70%);bottom:2%;height:var(--sh,56%);z-index:2;background:none;border:0;padding:0;filter:drop-shadow(0 14px 12px rgba(0,0,0,.4))}
.rafa img{height:100%;display:block}

/* hotspots */
.hs{position:absolute;background:none;border:0;z-index:3;border-radius:6px}
.hs:hover{outline:3px dashed rgba(243,230,200,.75);outline-offset:2px}
.hs .mk{position:absolute;left:50%;top:50%;translate:-50% -50%;width:clamp(30px,3.6vw,54px);aspect-ratio:1;background:url(img/ui/k_badge.webp) center/100% 100% no-repeat;color:var(--ink);font:700 clamp(15px,1.8vw,26px)/1 K;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 3px 4px rgba(0,0,0,.45));transition:opacity .2s}
.hs.seen .mk{opacity:.5}
.nomk .hs .mk{display:none}
.hs.bonus .mk{width:clamp(24px,2.8vw,40px);font-size:clamp(14px,1.6vw,22px)}

/* bubble */
.bub{position:absolute;right:21%;bottom:45%;translate:0 12px;z-index:6;isolation:isolate;width:min(560px,56%);padding:clamp(22px,3.4vh,34px) clamp(40px,5vw,66px) clamp(40px,5.6vh,58px);color:var(--ink);text-align:center;opacity:0;pointer-events:none;transition:.22s;filter:drop-shadow(0 10px 14px rgba(0,0,0,.45))}
.bub::before{content:'';position:absolute;inset:0;z-index:-1;background:url(img/ui/k_bubble.webp) center/100% 100% no-repeat;transform:scaleX(-1)}
.bub.on{opacity:1;translate:0 0}
.bub .tg{font:700 clamp(11px,1.1vw,14px)/1 K;letter-spacing:.14em;text-transform:uppercase;color:#6b5a3c}
.bub .en{font:700 clamp(24px,3.1vw,42px)/1.15 K;margin-top:4px}
.bub .pt{font:400 clamp(14px,1.5vw,19px)/1.3 K;margin-top:4px;color:#4a3f30}
.nopt .bub .pt{display:none}

/* action buttons */
.acts{position:absolute;left:50%;bottom:2.2%;translate:-50% 0;z-index:5;display:flex;gap:clamp(8px,1.4vw,22px)}
.act{background:url(img/ui/k_choice.webp) center/100% 100% no-repeat;border:0;color:var(--ink);text-align:center;padding:clamp(14px,2.4vh,24px) clamp(30px,3.4vw,50px) clamp(14px,2.4vh,24px) clamp(62px,6vw,88px);font:700 clamp(17px,2vw,27px)/1.1 K;white-space:nowrap;filter:drop-shadow(0 5px 6px rgba(0,0,0,.4));transition:.15s}
.act:hover{filter:brightness(1.07) drop-shadow(0 5px 6px rgba(0,0,0,.4))}

/* panel */
.shade{position:absolute;inset:0;z-index:8;background:rgba(14,28,28,.62);display:none;align-items:center;justify-content:center}
.shade.on{display:flex}
.panel{width:min(900px,92%);max-height:none;overflow:visible;transform-origin:center;background:none;border:38px solid transparent;border-image:url(img/ui/k_panel.webp) 70 fill/38px stretch;color:var(--ink);padding:clamp(26px,4.4vh,44px) clamp(14px,2.4vw,40px) clamp(6px,1.4vh,16px) clamp(40px,5vw,72px);filter:drop-shadow(0 14px 20px rgba(0,0,0,.5))}
.panel .k{font:700 clamp(11px,1.1vw,14px)/1 K;letter-spacing:.14em;text-transform:uppercase;color:#6b5a3c}
.panel h2{font:700 clamp(26px,3.4vw,46px)/1.1 K;margin:6px 0 10px}
.tabs{display:flex;gap:10px;margin:2px 0 12px}
.tab{background:url(img/ui/k_tile.webp) center/100% 100% no-repeat;border:0;padding:clamp(10px,1.6vh,16px) clamp(20px,2.4vw,34px);font:700 clamp(15px,1.7vw,22px)/1.1 K;color:var(--ink);opacity:.62}
.tab.on{opacity:1;background-image:url(img/ui/k_tile2.webp)}
.steps{list-style:none;padding:0;counter-reset:s}
.steps li{counter-increment:s;font:700 clamp(17px,2vw,26px)/1.3 K;margin:8px 0;padding-left:1.7em;position:relative}
.steps li::before{content:counter(s)".";position:absolute;left:0;color:var(--terra)}
.steps li span{display:block;font:400 clamp(15px,1.7vw,21px)/1.3 K;color:#4a3f30}
.how{font:400 clamp(15px,1.7vw,21px)/1.3 K;color:#4a3f30;margin:0 0 10px}
.lines{margin:10px 0 4px}
.lines p{font:700 clamp(20px,2.4vw,32px)/1.5 K;border-bottom:3px solid var(--ink);margin:4px 0}
.bank{margin-top:12px;font:400 clamp(15px,1.7vw,21px)/1.3 K}
.bank b{background:var(--hl);padding:0 7px;margin-right:6px;font-weight:700;display:inline-block}
.qs{display:grid;gap:4px}
.q{text-align:left;background:url(img/ui/k_choice.webp) center/100% 100% no-repeat;border:0;padding:clamp(10px,1.5vh,15px) 6% clamp(10px,1.5vh,15px) 16%;text-align:center;font:700 clamp(16px,1.7vw,22px)/1.2 K;color:var(--ink);filter:drop-shadow(0 3px 4px rgba(0,0,0,.3))}
.q:hover{filter:brightness(1.07) drop-shadow(0 3px 4px rgba(0,0,0,.3))}
.big{font:700 clamp(30px,4.4vw,62px)/1.1 K;margin:6px 0 2px}
.mania{font:400 clamp(16px,1.9vw,24px)/1.3 K;color:#4a3f30;margin-bottom:6px}
.be{display:grid;grid-template-columns:1fr auto;gap:2vw;align-items:end}.be img{height:clamp(200px,44vh,380px);margin-right:1vw;filter:drop-shadow(0 8px 8px rgba(0,0,0,.3))}

.prof{display:grid;grid-template-columns:auto 1fr;gap:clamp(14px,2.4vw,34px);align-items:start}
.prof .cd{height:clamp(200px,44vh,380px);rotate:-2deg;filter:drop-shadow(0 10px 10px rgba(0,0,0,.35));display:block}
.prof .sub{font:400 clamp(15px,1.8vw,22px)/1.3 K;margin:0 0 8px}
.prof .sub mark{background:var(--hl);padding:0 6px;margin-right:-5px;font-weight:700}
.ql{display:grid;grid-template-columns:1fr 1fr;gap:2px 28px;margin:4px 0 8px}
.ql div{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--ink);padding:2px 0;font:700 clamp(15px,1.7vw,22px)/1.3 K}
.ql i{display:inline-block;width:.8em;height:.8em;border:2.5px solid var(--ink);border-radius:50%;margin-left:5px}
.ql i.f{background:var(--mus)}
.tg2{display:flex;flex-wrap:wrap;gap:8px 18px;font:400 clamp(14px,1.6vw,20px)/1.3 K;margin:4px 0}
.tg2 b{background:var(--ink);color:var(--cream);font:700 clamp(10px,1vw,13px)/1 K;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;margin-right:6px}
.say{font:700 clamp(20px,2.6vw,34px)/1.15 K;margin:4px 0 6px}
.say small{display:block;font:700 clamp(10px,1vw,13px)/1 K;letter-spacing:.14em;text-transform:uppercase;color:#6b5a3c;margin-bottom:2px}
@media (max-height:700px){.prof .cd{height:clamp(190px,50vh,300px)}.ql div{padding:0}.prof .sub{margin:0 0 4px}}

.tab,.ptab{background:url(img/ui/k_tile.webp) center/100% 100% no-repeat;border:0;padding:clamp(10px,1.6vh,16px) clamp(20px,2.4vw,34px);font:700 clamp(15px,1.7vw,22px)/1.1 K;color:var(--ink);opacity:.62}
.ptab.on{opacity:1;background-image:url(img/ui/k_tile2.webp)}
.who{display:flex;gap:clamp(14px,2vw,28px);align-items:center;margin-bottom:6px}
.av{width:clamp(96px,15vh,150px);aspect-ratio:1;object-fit:cover;border:4px solid var(--ink);rotate:-2deg;box-shadow:0 6px 8px rgba(0,0,0,.25)}
.who h2{margin:0}.hd{font:400 clamp(14px,1.6vw,20px)/1.3 K;color:#4a3f30}.hd b{color:var(--ink)}
.bio{font:700 clamp(19px,2.3vw,30px)/1.2 K;margin-top:4px}
.fx{display:grid;grid-template-columns:1fr 1fr;gap:2px 28px;margin:6px 0}
.fx div{display:flex;flex-direction:column;border-bottom:2px solid var(--ink);padding:3px 0}
.fx b,.bf b{font:700 clamp(10px,1vw,13px)/1.4 K;letter-spacing:.14em;text-transform:uppercase;color:#6b5a3c}
.fx span{font:700 clamp(17px,2vw,26px)/1.2 K}
.bf{display:flex;gap:14px;align-items:center;margin:8px 0 2px}
.bf img{height:clamp(70px,13vh,120px);rotate:2deg;filter:drop-shadow(0 4px 5px rgba(0,0,0,.3))}
.bf .fn{display:block;font:700 clamp(20px,2.4vw,32px)/1.1 K}.bf .fl{display:block;font:400 clamp(14px,1.6vw,20px)/1.3 K;color:#4a3f30}
.posts{display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,2vw,28px);margin:4px 0}
.po{background:#fbf5e6;padding:10px 10px 12px;box-shadow:0 6px 10px rgba(0,0,0,.28)}
.po:nth-child(1){rotate:-1.2deg}.po:nth-child(2){rotate:1deg}
.po img{width:100%;aspect-ratio:330/165;object-fit:cover;display:block}
.po .cp{font:700 clamp(15px,1.8vw,23px)/1.25 K;margin:8px 0 6px}
.po .cm{font:400 clamp(13px,1.5vw,19px)/1.3 K;color:#4a3f30;border-top:2px dashed #b9a77f;padding-top:6px}.po .cm b{display:block;color:var(--ink)}
@media (max-height:700px){.po img{aspect-ratio:330/120}.prof .cd{height:clamp(170px,40vh,260px)}.tabs{margin:0 0 4px}.ptab{padding:8px 22px}.panel .k{display:none}.av{width:92px}.fx div{padding:0}.bf img{height:64px}.po .cp{margin:4px 0}.po .sp{margin:0 0 3px}.bio{margin-top:0}}

.sp{display:flex;align-items:center;gap:clamp(10px,1.4vw,18px);margin:0 0 6px}
.spb{position:relative;display:flex;align-items:center;gap:8px;background:transparent;border:0;padding:2px 4px;font:700 clamp(15px,1.8vw,22px)/1 K;color:var(--ink);cursor:pointer}
.spb img{height:clamp(30px,4vw,48px);width:auto;display:block;transition:scale .15s}
.po .sp img{width:auto;aspect-ratio:auto;object-fit:contain}.po .spb em img{width:100%;height:auto}.spb:active img{scale:.88}
.spb em{font-style:normal;position:absolute;left:-6px;top:-12px;width:clamp(26px,3.4vw,40px);pointer-events:none;opacity:0}
.spb em img{height:auto;width:100%}
.spb.pop em{animation:bur .55s ease-out}
@keyframes bur{0%{opacity:1;scale:.5}100%{opacity:0;scale:1.5}}
.spb span b.n{font-weight:700}.spb span small{font:700 clamp(10px,1vw,13px)/1 K;letter-spacing:.1em;text-transform:uppercase;color:#6b5a3c;margin-left:5px}
.sp .cmt{display:flex;align-items:center;gap:6px;font:700 clamp(15px,1.8vw,22px)/1 K;color:var(--ink)}.sp .cmt img{height:clamp(22px,2.8vw,32px)}
.cin{display:flex;gap:8px;align-items:center;margin-top:2px}
.cin input{flex:1;min-width:0;background:transparent;border:0;border-bottom:2px solid var(--ink);font:400 clamp(14px,1.6vw,20px)/1.3 K;color:var(--ink);padding:2px 2px;outline:none}
.cin input::placeholder{color:#8a7a5c}.cin input:focus{background:var(--hl)}
.cin button{background:var(--ink);color:var(--cream);border:0;font:700 clamp(12px,1.3vw,16px)/1 K;letter-spacing:.08em;text-transform:uppercase;padding:7px 12px}
.cdone{display:block;font:700 clamp(15px,1.8vw,22px)/1.25 K;color:var(--ink);background:var(--hl);padding:2px 8px;margin-top:2px}
.back{margin-top:10px;background:url(img/ui/btn_main.webp) center/100% 100% no-repeat;border:0;padding:clamp(12px,2vh,18px) clamp(30px,3vw,46px);font:700 clamp(16px,1.8vw,22px)/1 K;color:#3a1d12}

/* peek bar */
.peek{position:fixed;right:14px;bottom:8px;z-index:20;font:700 10px/1 K;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.peek a{color:var(--cream);text-underline-offset:3px}.peek b{color:var(--mus)}.peek button{background:none;border:0;color:var(--cream);text-decoration:underline;text-underline-offset:3px;font:inherit}
@media (max-height:700px){.panel{border-width:30px;padding-top:22px}.panel h2{font-size:clamp(24px,2.8vw,36px);margin:2px 0 4px}.how{display:none}.tabs{margin:0 0 6px}.q{padding-top:7px;padding-bottom:7px}.steps li{margin:3px 0}.back{margin-top:6px}.lines p{line-height:1.3}}
@media (max-height:620px){.acts{bottom:1.4%}.bub{bottom:44%}}

/* choice buttons: keep the tape at its natural proportion (horizontal 3-slice) */
.q,.act{box-sizing:border-box;display:flex;align-items:center;justify-content:center;background:none;border:solid transparent;border-width:0 calc(var(--h)*.31) 0 calc(var(--h)*.465);border-image:url(img/ui/k_choice.webp) 0 100 0 150 fill/0 calc(var(--h)*.31) 0 calc(var(--h)*.465) stretch;height:var(--h)}
.q{--h:clamp(44px,6.2vh,58px);padding:0 8px}
.act{--h:clamp(52px,7.6vh,74px);padding:0 10px 0 4px}
.panel .k{margin-bottom:8px}.panel h2{margin-top:2px}
.go{position:absolute;right:2.4%;top:13%;bottom:auto;left:auto;z-index:4;--h:clamp(40px,5.4vh,54px);font-size:clamp(12px,1.3vw,17px)}
.go[hidden]{display:none}

/* character bar */
.dk{width:min(100vw,calc((100vh - var(--dk))*1.7778));height:var(--dk);background:#0e1f1f;border-top:3px solid #c9a24a;display:flex;align-items:center;justify-content:space-between;padding:0 2.2%;flex:none}
.dkrow{display:flex;align-items:flex-end;gap:clamp(8px,1.1vw,16px)}
.dkav{display:flex;flex-direction:column;align-items:center;gap:3px;font:700 11px/1 K;color:var(--cream);letter-spacing:.08em;text-transform:uppercase;opacity:.72;text-decoration:none;transition:opacity .15s}
a.dkav:hover{opacity:1}
.dkav i{display:block;width:clamp(36px,4.1vw,52px);aspect-ratio:1;border-radius:50%;background:center/cover;border:3px solid var(--cream);box-shadow:0 3px 0 #000a;transition:transform .15s}
a.dkav:hover i{transform:translateY(-2px)}
.dkav.dkon{opacity:1}.dkav.dkon i{width:clamp(44px,4.9vw,62px);border-color:var(--mus);box-shadow:0 0 0 3px var(--ink),0 4px 0 3px #000a}
.dkav.dkon span{color:var(--mus)}
.dkav.dklock{opacity:.5}.dkav.dklock i{background:#1c3a3a;border:3px dashed #5b7a73;display:flex;align-items:center;justify-content:center;font:700 clamp(16px,1.7vw,22px) K;color:#5b7a73;box-shadow:none;font-style:normal}
.dktg{display:flex;gap:clamp(10px,1.6vw,22px)}
.dktg button{background:none;border:0;color:var(--cream);font:700 10px/1 K;letter-spacing:.12em;text-transform:uppercase;text-decoration:underline;text-underline-offset:3px;opacity:.85;cursor:pointer}
@media (max-height:700px){:root{--dk:72px}.dkav{font-size:9px}}
@media (max-height:420px){.bub{bottom:38%;padding:14px 34px 28px}.bub .en{font-size:20px}.bub .pt{font-size:12px}}
@media (max-width:600px){body{overflow-x:hidden}.dk{width:100vw;height:auto;min-height:var(--dk);flex-direction:column;gap:6px;padding:6px 8px}.dkrow{overflow-x:auto;max-width:100%}.dktg{flex-wrap:wrap;justify-content:center;gap:8px 14px}.acts{scale:.6;transform-origin:center bottom;gap:6px;bottom:0}.title{left:0}}

</style></head>
<body>
<div class="stage" id="st">
 <div class="title"><small>Mumbleton Academy</small><b id="ttl"></b></div>
 <div id="hsl"></div>
 <button class="act go" id="go" hidden></button>
 <button class="rafa" id="rf"><img id="stand" alt=""></button>

 <div class="bub" id="bub"></div>

 <div class="acts">
  <button class="act" data-p="write">Write about me</button>
  <button class="act" data-p="ask">Ask me</button>
  <button class="act" data-p="be">Be me</button>
 </div>

 <div class="shade" id="sh"><div class="panel" id="pn"></div></div>
</div>
<div class="dk"><div class="dkrow" id="who"></div><div class="dktg"><button id="sdb">Sound: on</button><button id="amb">Ambience: off</button><button id="mkb">Markers: on</button><button id="ptb">Portuguese: on</button></div></div>

const ID=(location.hash.slice(1)||new URLSearchParams(location.search).get('a')||'rafa').toLowerCase(),D=AP[ID]||AP.rafa;
const PROF=D.prof,KIDS=D.kids,SC=[{title:D.title,room:D.room,obj:D.obj,sx:D.sx,go:D.go}].concat(D.more||[]),seenS=SC.map(()=>new Set());let OBJ=D.obj,sc=0;
$('stand').src=D.stand;$('stand').alt=D.name;$('rf').setAttribute('aria-label',D.name);
$('bub').style.marginBottom=D.bm||'0';$('rf').style.setProperty('--sh',D.sh);
function scene(n){sc=n;const S=SC[n];OBJ=S.obj;$('st').style.backgroundImage='url('+S.room+')';$('ttl').textContent=S.title;document.title=S.title+' · Mumbleton Academy';$('rf').style.setProperty('--sx',S.sx);
 $('hsl').innerHTML=OBJ.map((o,i)=>'<button class="hs'+(i>7?' bonus':'')+(seenS[n].has(i)?' seen':'')+'" data-i="'+i+'" style="left:'+o[3][0]+'%;top:'+o[3][1]+'%;width:'+o[3][2]+'%;height:'+o[3][3]+'%"><span class="mk">'+(i>7?'+':i+1)+'</span></button>').join('');
 const g=$('go');g.hidden=SC.length<2;if(SC.length>1)g.textContent='Go to the '+SC[(n+1)%SC.length].go;$('bub').classList.remove('on');if(window.AMBU)AMBU()}
$('go').onclick=()=>scene((sc+1)%SC.length);
const ORD=['rafa','pim','juno','kai','odette','theo','mina','zuri'];
$('who').innerHTML=ORD.map(k=>{const a=AP[k];if(!a)return '<div class="dkav dklock"><i>?</i><span>'+k[0].toUpperCase()+k.slice(1)+'</span></div>';
 const im='<i style="background-image:url('+a.prof.avatar+')"></i><span>'+a.name+'</span>';
 return k===ID?'<div class="dkav dkon" aria-current="true">'+im+'</div>':'<a class="dkav" href="#'+k+'" onclick="setTimeout(()=>location.reload(),260)">'+im+'</a>'}).join('');
let bt;
function say(tag,en,pt,ms=4200){const b=$('bub');b.innerHTML='<div class="tg">'+tag+'</div><div class="en">'+en+'</div><div class="pt">'+pt+'</div>';b.classList.add('on');clearTimeout(bt);bt=setTimeout(()=>b.classList.remove('on'),ms)}
$('hsl').onclick=e=>{const h=e.target.closest('.hs');if(!h)return;const i=+h.dataset.i,o=OBJ[i];say(o[0],o[1],o[2]);seenS[sc].add(i);h.classList.add('seen');};
scene(0);
let ptab='about';
function profile(t){if(typeof t==='string')ptab=t;const d=PROF,dots=n=>[1,2,3].map(i=>'<i class="'+(i<=n?'f':'')+'"></i>').join('');
 const tb='<div class="tabs">'+[['about','About'],['stats','Stats']].concat(d.posts.length?[['posts','Posts']]:[]).map(x=>'<button class="ptab'+(ptab===x[0]?' on':'')+'" data-t="'+x[0]+'">'+x[1]+'</button>').join('')+'</div>';
 let b='';
 if(ptab==='about')b='<div class="who"><img class="av" src="'+d.avatar+'" alt=""><div><h2>'+d.name+'</h2><div class="hd">'+d.handle+' · At the Academy since <b>'+d.since+'</b></div><p class="bio">“'+d.bio+'”</p></div></div>'
  +'<div class="fx">'+d.facts.map(f=>'<div><b>'+f[0]+'</b><span>'+f[1]+'</span></div>').join('')+'</div>'
  +'<div class="bf"><img src="'+d.friend.card+'" alt=""><div><b>Best friend</b><span class="fn">'+d.friend.name+'</span><span class="fl">“'+d.friend.line+'”</span></div></div>';
 if(ptab==='stats')b='<div class="prof"><img class="cd" src="'+d.card+'" alt=""><div><div class="k">Apprentice · '+d.no+' / 08</div><h2>'+d.name+'</h2><p class="sub">'+d.intro+' <mark>'+d.hl+'</mark>.</p>'
  +'<div class="ql">'+d.q.map(x=>'<div>'+x[0]+'<span>'+dots(x[1])+'</span></div>').join('')+'</div>'
  +'<div class="say"><small>Always says</small>“'+d.say+'”</div>'
  +'<div class="tg2"><span><b>When it goes wrong</b>'+d.mania+'</span></div>'
  +'<div class="tg2"><span><b>Likes</b>'+d.likes+'</span><span><b>Scared of</b>'+d.scared+'</span></div></div></div>';
 if(ptab==='posts')b='<div class="posts">'+d.posts.map((x,i)=>'<div class="po"><img src="'+x.img+'" alt=""><p class="cp">'+x.cap+'</p><div class="sp"><button class="spb" data-i="'+i+'" aria-label="Send a spark"><img class="hh" src="img/ui/sp_heart'+(x.sp?'1':'0')+'.webp" alt=""><em><img src="img/ui/sp_burst.webp" alt=""></em><span><b class="n">'+(x.sp||0)+'</b><small>'+(x.sp===1?'spark':'sparks')+'</small></span></button><span class="cmt"><img src="img/ui/sp_bubble.webp" alt="">'+(x.comment?1:0)+'</span></div><div class="cm"><b>'+(x.comment?'Our class says:':'Write a comment for '+d.name+'.')+'</b>'+(x.comment?'<span class="cdone"></span>':'<div class="cin"><input data-i="'+i+'" maxlength="90" placeholder="Example: “'+x.ex+'”"><button data-i="'+i+'">Post</button></div>')+'</div></div>').join('')+'</div>';
 panel('<div class="k">Apprentice profile</div>'+tb+b+'<button class="back">Back to the room</button>');
 $('pn').querySelectorAll('.ptab').forEach(t=>t.onclick=()=>profile(t.dataset.t));
 $('pn').querySelectorAll('.cdone').forEach((e,k)=>{const x=d.posts.filter(p=>p.comment)[k];e.textContent='“'+x.comment+'”'});
 $('pn').querySelectorAll('.spb').forEach(bt=>bt.onclick=()=>{const x=d.posts[+bt.dataset.i];x.sp=(x.sp||0)+1;bt.querySelector('.n').textContent=x.sp;bt.querySelector('small').textContent=x.sp===1?'spark':'sparks';bt.querySelector('.hh').src='img/ui/sp_heart1.webp';bt.classList.remove('pop');void bt.offsetWidth;bt.classList.add('pop')});
 const send=i=>{const v=$('pn').querySelector('input[data-i="'+i+'"]').value.trim();if(v){d.posts[i].comment=v;profile()}};
 $('pn').querySelectorAll('.cin button').forEach(bt=>bt.onclick=()=>send(+bt.dataset.i));
 $('pn').querySelectorAll('.cin input').forEach(inp=>inp.onkeydown=e=>{if(e.key==='Enter')send(+inp.dataset.i)})}
$('rf').onclick=profile;

let lv='a';
function fit(){const p=$('pn'),s=$('sh');if(!s.classList.contains('on'))return;p.style.zoom=1;const k=Math.min(1,s.clientHeight*.94/p.offsetHeight,s.clientWidth*.96/p.offsetWidth);p.style.zoom=k<1?k:1}
addEventListener('resize',fit);
function panel(h){$('pn').innerHTML=h;if(!$('sh').classList.contains('on'))SND.play('painel-abre');$('sh').classList.add('on');fit();$('pn').querySelectorAll('img').forEach(i=>{if(!i.complete)i.addEventListener('load',fit,{once:true})});$('pn').querySelectorAll('.tab').forEach(t=>t.onclick=()=>{lv=t.dataset.l;open_(cur)});const bk=$('pn').querySelector('.back');if(bk)bk.onclick=()=>$('sh').classList.remove('on');$('pn').querySelectorAll('.q').forEach(q=>q.onclick=()=>{$('sh').classList.remove('on');say(D.name,q.dataset.a,'',6500);$('bub').classList.add('hidept')})}
const tabs=()=>'<div class="tabs"><button class="tab'+(lv==='a'?' on':'')+'" data-l="a">Kids 1–3</button><button class="tab'+(lv==='b'?' on':'')+'" data-l="b">Kids 4–6</button></div>';
let cur='write';
function open_(p){cur=p;let h;
 if(p==='write'){const d=KIDS[lv].write;
  h='<div class="k">Write about me</div><h2>Write about '+D.name+'.</h2>'+tabs();
  if(lv==='a')h+='<ol class="steps"><li>Look at '+SC[sc].title+'.</li><li>Finish the sentences.</li></ol><div class="lines">'+d.lines.map(l=>'<p>'+l+'</p>').join('')+'</div><div class="bank">'+d.bank.map(w=>'<b>'+w+'</b>').join('')+'</div>';
  else h+='<ol class="steps">'+d.steps.map(s=>'<li>'+s[0]+'<span>'+s[1]+'</span></li>').join('')+'</ol><div class="bank">Example: <b>'+d.example+'</b></div>';
  h+='<button class="back">Back to the room</button>'}
 if(p==='ask'){const d=KIDS[lv];
  h='<div class="k">Ask me</div><h2>Ask '+D.name+' a question.</h2>'+tabs()+'<p class="how">A student reads a question out loud. Then tap it, and '+D.name+' answers.</p><div class="qs">'+d.qs.map(q=>'<button class="q" data-a="'+q[1]+'">'+q[0]+'</button>').join('')+'</div><button class="back">Back to the room</button>'}
 if(p==='be'){const e=D.be;
  h='<div class="be"><div><div class="k">Be me</div><h2>Be '+D.name+'!</h2><div class="big">“'+e.big+'”</div><div class="mania">'+e.mania+'</div><ol class="steps">'+e.steps.map(x=>'<li>'+x[0]+'<span>'+x[1]+'</span></li>').join('')+'</ol></div><img src="'+D.stand+'" alt=""></div><button class="back">Back to the room</button>'}
 panel(h)}
document.querySelectorAll('.acts .act').forEach(b=>b.onclick=()=>open_(b.dataset.p));
$('sh').onclick=e=>{if(e.target===$('sh'))$('sh').classList.remove('on')};

let mk=true,pt=true;
$('mkb').onclick=()=>{mk=!mk;$('st').classList.toggle('nomk',!mk);$('mkb').textContent='Markers: '+(mk?'on':'off')};
$('ptb').onclick=()=>{pt=!pt;$('st').classList.toggle('nopt',!pt);$('ptb').textContent='Portuguese: '+(pt?'on':'off')};

/* sound */
const SND=(()=>{const V={'objeto-toc':.5,'objeto-bonus':.5,'personagem-toca':.6,'cena-porta':.6,'troca-aprendiz':.5,'painel-abre':.55,'painel-fecha':.45,'aba':.35,'botao-papel':.55,'resposta-ask':.4,'faisca':.7,'comentario':.4},C={};
 let on=true,am=false;try{on=localStorage.getItem('mumb_sound')!=='off';am=localStorage.getItem('mumb_amb')==='on'}catch(e){}
 const AM={pim0:'amb-cozinha',odette0:'amb-chuva',kai0:'amb-vento'};let loop=null,loopN='';
 const f=n=>C[n]||(C[n]=new Audio('snd/'+n+'.mp3'));
 const o={play(n){if(!on)return;try{const x=f(n).cloneNode();x.volume=V[n]||.5;const r=x.play();r&&r.catch&&r.catch(()=>{})}catch(e){}},
  amb(){const n=on&&am?AM[ID+sc]:null;if(n===loopN)return;if(loop){const l=loop;let v=l.volume;const t=setInterval(()=>{v-=.02;if(v<=.01){clearInterval(t);l.pause()}else l.volume=v},60)}loop=null;loopN=n||'';
   if(n){const x=new Audio('snd/'+n+'.mp3');x.loop=true;x.volume=.14;loop=x;const r=x.play();r&&r.catch&&r.catch(()=>{loop=null;loopN=''})}},
  tog(){on=!on;try{localStorage.setItem('mumb_sound',on?'on':'off')}catch(e){}$('sdb').textContent='Sound: '+(on?'on':'off');o.amb()},
  togA(){am=!am;try{localStorage.setItem('mumb_amb',am?'on':'off')}catch(e){}$('amb').textContent='Ambience: '+(am?'on':'off');o.amb()}};
 $('sdb').textContent='Sound: '+(on?'on':'off');$('amb').textContent='Ambience: '+(am?'on':'off');$('sdb').onclick=o.tog;$('amb').onclick=o.togA;return o})();
window.AMBU=()=>SND.amb();
document.addEventListener('click',e=>{const t=e.target;let h;
 if(h=t.closest('.hs'))return SND.play(h.classList.contains('bonus')?'objeto-bonus':'objeto-toc');
 if(t.closest('#rf'))return SND.play('personagem-toca');
 if(t.closest('#go'))return SND.play('cena-porta');
 if(t.closest('a.dkav'))return SND.play('troca-aprendiz');
 if(t.closest('.acts .act'))return SND.play('botao-papel');
 if(t.closest('.tab,.ptab'))return SND.play('aba');
 if(t.closest('.back')||t===$('sh'))return SND.play('painel-fecha');
 if(t.closest('.q'))return SND.play('resposta-ask');
 if(t.closest('.spb'))return SND.play('faisca');
 if(t.closest('.cin button'))return SND.play('comentario')},true);
