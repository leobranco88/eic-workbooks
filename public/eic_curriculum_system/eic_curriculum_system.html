<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EIC · Curriculum System — A1 a C2</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
  :root{
    --ink:#0A0A0F; --paper:#FAFAF7; --accent:#E63946; --highlight:#FFE89C;
    --teal:#0F766E; --purple:#534AB7; --line: rgba(10,10,15,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);}

  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 28px;border-bottom:3px solid var(--ink);background:#fff;
    position:sticky;top:0;z-index:10;
  }
  .topbar h1{font-size:17px;font-weight:900;margin:0;letter-spacing:-0.01em;}
  .topbar .sub{font-size:11.5px;font-weight:600;color:rgba(10,10,15,0.5);}

  .tab-bar{
    display:flex;gap:6px;padding:12px 28px;background:#fff;border-bottom:1px solid var(--line);
    overflow-x:auto;position:sticky;top:57px;z-index:9;
  }
  .tab-btn{
    font-family:'Inter',sans-serif;font-size:12.5px;font-weight:700;
    background:var(--paper);border:1px solid var(--line);border-radius:100px;
    padding:8px 16px;cursor:pointer;white-space:nowrap;color:rgba(10,10,15,0.65);
    transition:all .15s ease;
  }
  .tab-btn:hover{border-color:var(--purple);color:var(--purple);}
  .tab-btn.active{background:var(--ink);color:#fff;border-color:var(--ink);}

  .tab-panel{display:none;}
  .tab-panel.active{display:block;}
  .tab-panel iframe{width:100%;border:none;display:block;min-height:400px;}

  .loading-msg{padding:60px;text-align:center;color:rgba(10,10,15,0.4);font-size:13px;font-weight:600;}
</style>
</head>
<body>

  <div class="topbar">
    <h1>EIC · Curriculum System</h1>
    <span class="sub">A1 → C2 · Micro-Recycling Maps · Base NatGeo Life</span>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" data-tab="hub" onclick="switchTab('hub')">Visão Geral</button>
<button class="tab-btn" data-tab="pp" onclick="switchTab('pp')">Present Perfect</button>
<button class="tab-btn" data-tab="cond" onclick="switchTab('cond')">Conditionals</button>
<button class="tab-btn" data-tab="passive" onclick="switchTab('passive')">Passive Voice</button>
<button class="tab-btn" data-tab="modals" onclick="switchTab('modals')">Modals of Deduction</button>
<button class="tab-btn" data-tab="reported" onclick="switchTab('reported')">Reported Speech</button>
<button class="tab-btn" data-tab="db" onclick="switchTab('db')">Banco de Dados</button>
  </div>

  <div class="tab-content">
    <div class="tab-panel active" id="panel-hub"><iframe id="iframe-hub" data-src="eic_curriculum_map.html" src="eic_curriculum_map.html" loading="lazy"></iframe></div>
<div class="tab-panel" id="panel-pp"><iframe id="iframe-pp" data-src="eic_micro_recycling_present_perfect.html"  loading="lazy"></iframe></div>
<div class="tab-panel" id="panel-cond"><iframe id="iframe-cond" data-src="eic_micro_recycling_conditionals.html"  loading="lazy"></iframe></div>
<div class="tab-panel" id="panel-passive"><iframe id="iframe-passive" data-src="eic_micro_recycling_passive_voice.html"  loading="lazy"></iframe></div>
<div class="tab-panel" id="panel-modals"><iframe id="iframe-modals" data-src="eic_micro_recycling_modals_deduction.html"  loading="lazy"></iframe></div>
<div class="tab-panel" id="panel-reported"><iframe id="iframe-reported" data-src="eic_micro_recycling_reported_speech.html"  loading="lazy"></iframe></div>
<div class="tab-panel" id="panel-db"><iframe id="iframe-db" data-src="eic_life_curriculum_database.html"  loading="lazy"></iframe></div>
  </div>

<script>
function resizeIframe(iframe) {
  try {
    var doc = iframe.contentWindow.document;
    var h = Math.max(doc.documentElement.scrollHeight, doc.body.scrollHeight);
    iframe.style.height = (h + 20) + 'px';
  } catch (e) {
    // cross-origin fallback (shouldn't happen when served from same domain)
    iframe.style.height = '1200px';
  }
}

function switchTab(id) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + id));
  var iframe = document.getElementById('iframe-' + id);
  if (iframe) {
    if (!iframe.getAttribute('src')) {
      iframe.setAttribute('src', iframe.dataset.src);
      iframe.addEventListener('load', function onload(){
        resizeIframe(iframe);
        iframe.removeEventListener('load', onload);
      });
    } else {
      // already loaded — recalculate height now that it's visible again
      requestAnimationFrame(function(){ resizeIframe(iframe); });
    }
  }
  window.scrollTo({top: 0, behavior: 'instant'});
}

// initial load of the first (default) tab
window.addEventListener('DOMContentLoaded', function(){
  var firstIframe = document.querySelector('.tab-panel.active iframe');
  if (firstIframe) {
    firstIframe.addEventListener('load', function(){ resizeIframe(firstIframe); });
  }
});
</script>

</body>
</html>
