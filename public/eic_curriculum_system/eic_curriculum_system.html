<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EIC · Curriculum System — A1 a C2</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
  :root{
    --ink:#0A0A0F; --paper:#FAFAF7; --accent:#E63946; --highlight:#FFE89C;
    --teal:#0F766E; --purple:#534AB7; --line: rgba(10,10,15,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);}

  .layout{display:flex;align-items:flex-start;min-height:100vh;}

  .sidebar{
    width:248px;flex-shrink:0;background:#fff;border-right:2px solid var(--ink);
    position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;
  }
  .sidebar-header{padding:20px 20px 16px;border-bottom:2px solid var(--ink);}
  .sidebar-header h1{font-size:15.5px;font-weight:900;margin:0 0 4px;letter-spacing:-0.01em;line-height:1.25;}
  .sidebar-header .sub{font-size:10.5px;font-weight:600;color:rgba(10,10,15,0.5);line-height:1.4;}

  .nav-scroll{padding:16px 12px 24px;flex:1;}
  .nav-group-label{
    font-size:10px;font-weight:800;letter-spacing:0.5px;text-transform:uppercase;
    color:rgba(10,10,15,0.4);padding:14px 10px 6px;
  }
  .nav-group-label:first-child{padding-top:2px;}
  .nav-btn{
    display:block;width:100%;text-align:left;font-family:'Inter',sans-serif;font-size:13px;font-weight:700;
    background:transparent;border:none;border-radius:9px;padding:9px 10px;cursor:pointer;
    color:rgba(10,10,15,0.65);transition:all .15s ease;margin-bottom:2px;
  }
  .nav-btn:hover{background:var(--purple-tint,#EEECFA);color:var(--purple);}
  .nav-btn.active{background:var(--ink);color:#fff;}

  .main-content{flex:1;min-width:0;position:relative;}
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}
  .tab-panel iframe{width:100%;border:none;display:block;min-height:100vh;}

  @media(max-width:760px){
    .layout{flex-direction:column;}
    .sidebar{width:100%;height:auto;position:relative;border-right:none;border-bottom:2px solid var(--ink);}
    .nav-scroll{display:flex;gap:6px;overflow-x:auto;padding:12px;}
    .nav-group-label{display:none;}
    .nav-btn{width:auto;white-space:nowrap;margin-bottom:0;}
  }
</style>
</head>
<body>

  <div class="layout">
    <div class="sidebar">
      <div class="sidebar-header">
        <h1>EIC · Curriculum System</h1>
        <span class="sub">A1 → C2 · Base NatGeo Life</span>
      </div>
      <div class="nav-scroll">
        <div class="nav-group-label">Currículo</div>
<button class="nav-btn active" data-tab="hub" onclick="switchTab('hub')">Visão Geral</button>
<div class="nav-group-label">Micro-Recycling Maps</div>
<button class="nav-btn" data-tab="pp" onclick="switchTab('pp')">Present Perfect</button>
<button class="nav-btn" data-tab="cond" onclick="switchTab('cond')">Conditionals</button>
<button class="nav-btn" data-tab="passive" onclick="switchTab('passive')">Passive Voice</button>
<button class="nav-btn" data-tab="modals" onclick="switchTab('modals')">Modals of Deduction</button>
<button class="nav-btn" data-tab="reported" onclick="switchTab('reported')">Reported Speech</button>
<div class="nav-group-label">Ferramentas</div>
<button class="nav-btn" data-tab="db" onclick="switchTab('db')">Banco de Dados</button>
<button class="nav-btn" data-tab="tracer" onclick="switchTab('tracer')">Rastreador de Retomada</button>
<button class="nav-btn" data-tab="risk" onclick="switchTab('risk')">Mapa de Risco</button>

      </div>
    </div>

    <div class="main-content">
      <div class="tab-panel active" id="panel-hub"><iframe id="iframe-hub" data-src="eic_curriculum_map.html" src="eic_curriculum_map.html" loading="lazy"></iframe></div>
<div class="tab-panel" id="panel-pp"><iframe id="iframe-pp" data-src="eic_micro_recycling_present_perfect.html"  loading="lazy"></iframe></div>
<div class="tab-panel" id="panel-cond"><iframe id="iframe-cond" data-src="eic_micro_recycling_conditionals.html"  loading="lazy"></iframe></div>
<div class="tab-panel" id="panel-passive"><iframe id="iframe-passive" data-src="eic_micro_recycling_passive_voice.html"  loading="lazy"></iframe></div>
<div class="tab-panel" id="panel-modals"><iframe id="iframe-modals" data-src="eic_micro_recycling_modals_deduction.html"  loading="lazy"></iframe></div>
<div class="tab-panel" id="panel-reported"><iframe id="iframe-reported" data-src="eic_micro_recycling_reported_speech.html"  loading="lazy"></iframe></div>
<div class="tab-panel" id="panel-db"><iframe id="iframe-db" data-src="eic_life_curriculum_database.html"  loading="lazy"></iframe></div>
<div class="tab-panel" id="panel-tracer"><iframe id="iframe-tracer" data-src="eic_overlap_tracer.html"  loading="lazy"></iframe></div>
<div class="tab-panel" id="panel-risk"><iframe id="iframe-risk" data-src="eic_placement_risk_map.html"  loading="lazy"></iframe></div>
    </div>
  </div>

<script>
function resizeIframe(iframe) {
  try {
    var doc = iframe.contentWindow.document;
    var h = Math.max(doc.documentElement.scrollHeight, doc.body.scrollHeight);
    iframe.style.height = (h + 40) + 'px';
  } catch(e) { /* cross-origin or not ready yet, ignore */ }
}

function switchTab(id) {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + id));
  const iframe = document.getElementById('iframe-' + id);
  if (iframe) {
    if (!iframe.getAttribute('src')) {
      iframe.setAttribute('src', iframe.dataset.src);
      iframe.addEventListener('load', function onload(){
        resizeIframe(iframe);
        iframe.removeEventListener('load', onload);
      });
    } else {
      resizeIframe(iframe);
    }
  }
  window.scrollTo(0, 0);
}

window.addEventListener('load', function(){
  var first = document.querySelector('.tab-panel.active iframe');
  if (first) {
    if (first.contentWindow && first.contentWindow.document.readyState === 'complete') {
      resizeIframe(first);
    } else {
      first.addEventListener('load', function(){ resizeIframe(first); });
    }
  }
});
</script>

</body>
</html>
