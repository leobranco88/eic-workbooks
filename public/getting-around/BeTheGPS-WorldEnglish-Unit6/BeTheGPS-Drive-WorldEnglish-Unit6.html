<style>
  :root{--ink:#0A0A0A;--mid:#545454;--light:#E8E8E4;--pen:#FF3C38}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:#fff;color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.4}

  .stage{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(360px,1fr);margin:0 24px 24px;border:1.5px solid var(--ink);height:calc(100vh - 120px);min-height:560px}
  .mapside{display:flex;align-items:center;background:#fff}
  .mapside svg{display:block;width:100%;height:auto;max-height:calc(100vh - 124px)}
  .panel{padding:26px 30px 24px;border-left:1.5px solid var(--ink);display:flex;flex-direction:column;min-height:0;overflow-y:auto}

  .tabs{display:flex;margin:0 0 22px}
  .tab{font:800 13px Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:9px 14px;background:#fff;color:var(--ink);border:1.5px solid var(--ink);border-radius:0;cursor:pointer}
  .tab+.tab{border-left:0}
  .tab[aria-pressed=true]{background:var(--ink);color:#fff}
  .tab:focus-visible,.b:focus-visible{outline:3px solid var(--pen);outline-offset:3px}

  .steps{list-style:none;margin:0 0 20px;padding:0;display:grid;gap:6px;font-size:15px;color:var(--mid);font-weight:600}
  .steps li{display:flex;gap:10px;align-items:baseline}
  .steps .n{flex:none;width:20px;height:20px;background:var(--ink);color:#fff;font:800 12px Inter,sans-serif;display:inline-grid;place-items:center;transform:translateY(-1px)}

  h1{font-size:clamp(30px,3.1vw,52px);font-weight:900;letter-spacing:-.03em;line-height:1.02;margin:0 0 22px}
  h1 em{font-style:normal;color:var(--pen)}
  .count{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mid);margin:0 0 8px}

  .sent{font-size:clamp(21px,2.2vw,34px);font-weight:700;letter-spacing:-.01em;line-height:1.75;margin:0}
  .sent b{font-weight:900}
  .blank{display:inline-block;width:5.2em;border-bottom:3px solid var(--ink);margin:0 .2em;transform:translateY(.1em)}
  .w{position:relative;display:inline-block;margin:0 .3em;white-space:nowrap;font-weight:900}
  .wr{position:absolute;left:-.5em;top:-.42em;width:calc(100% + 1em);height:1.95em;overflow:visible;pointer-events:none}
  .wr path,.ring path{fill:none;stroke:var(--pen);stroke-width:3;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
  .w.on .wr path,.ring.on path{animation:draw .7s ease-out forwards}
  .ring.pring path{stroke-width:1.5}
  .ring:not(.on) path,.w:not(.on) .wr path{opacity:0}
  @keyframes draw{to{stroke-dashoffset:0}}

  .pen{font-family:Caveat,cursive;font-weight:700;color:var(--pen);line-height:1;display:inline-block}
  .fb{font-size:clamp(26px,2.1vw,34px);margin:12px 0 0 4px;transform:rotate(-2deg);transform-origin:left;min-height:1em}

  .prog{display:flex;gap:5px;margin:auto 0 0;padding-top:22px}
  .prog span{flex:1;height:6px;background:var(--light)}
  .prog span.done{background:var(--ink)}
  .prog span.cur{background:var(--pen)}

  .controls{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap;align-items:center}
  .b{font:800 16px Inter,sans-serif;padding:10px 18px;background:#fff;color:var(--ink);border:1.5px solid var(--ink);border-radius:0;cursor:pointer}
  .b:hover:not(:disabled){background:#F4F4F1}
  .b:disabled{opacity:.35;cursor:default}

  ol.mine{list-style:none;margin:0;padding:0;display:grid;gap:4px}
  ol.mine li{font-size:clamp(19px,1.8vw,27px);font-weight:700;line-height:1.5;padding-left:14px;border-left:3px solid var(--ink)}
  ol.mine li .w{margin:0}
  .empty{font-size:18px;color:var(--mid);font-weight:600;margin:0}

  /* map */
  .pl{cursor:pointer}
  .pl rect{fill:#fff;stroke:var(--ink);stroke-width:1.5}
  .pl.park rect{stroke-dasharray:5 5}
  .pl text{font-family:Inter,sans-serif;font-size:13px;font-weight:700;fill:var(--ink);text-anchor:middle;pointer-events:none}
  .pl:hover rect{stroke-width:3}
  .pl:focus-visible{outline:none}
  .pl:focus-visible rect{stroke:var(--pen);stroke-width:3.5}
  .pl.focus rect,.pl.sel rect{stroke:var(--pen);stroke-width:3.5}
  .pl.focus rect{animation:pop .6s ease-out 1}
  @keyframes pop{0%{stroke-width:9}100%{stroke-width:3.5}}
  .st{font-family:Inter,sans-serif;font-size:11px;font-weight:800;letter-spacing:.13em;fill:#545454;text-anchor:middle;pointer-events:none}
  #tagT{font-family:Caveat,cursive;font-weight:700;font-size:38px;fill:var(--pen);paint-order:stroke;stroke:#fff;stroke-width:6px;stroke-linejoin:round;pointer-events:none;transition:opacity .2s}
  .hide{display:none}

  @media (prefers-reduced-motion:reduce){.w.on .wr path,.ring.on path{animation:none;stroke-dashoffset:0}.pl.focus rect{animation:none}}
  @media (max-width:900px){
    .stage{grid-template-columns:1fr;margin:12px;height:auto}
    .mapside{position:sticky;top:0;z-index:2;border-bottom:1.5px solid var(--ink)}
    .panel{border-left:0;padding:20px 18px;overflow:visible}
  }

  /* Drive */
  h1{font-size:clamp(28px,2.9vw,46px)}
  h1 small{display:block;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mid);margin:0 0 8px}
  ol.dirs{list-style:none;margin:0;padding:0;display:grid;gap:2px}
  ol.dirs li{display:grid;grid-template-columns:30px 1fr;gap:0 4px;padding:9px 0;border-top:1px solid var(--light);opacity:.38;transition:opacity .25s}
  ol.dirs li.on,ol.dirs li.ok{opacity:1}
  ol.dirs .n{width:22px;height:22px;background:var(--ink);color:#fff;font:800 12px Inter,sans-serif;display:grid;place-items:center;margin-top:4px}
  ol.dirs .s{font-size:clamp(18px,1.7vw,25px);font-weight:700;line-height:1.7;letter-spacing:-.01em}
  .gap{display:inline-block;min-width:3.4em;border-bottom:3px solid var(--ink);margin:0 .25em;transform:translateY(.12em)}
  .chips{grid-column:2;display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
  .chips .b{font-size:17px}
  .pl.dest rect{stroke:var(--pen);stroke-width:3.5}
  .pl.dest text{font-weight:900}

  .moments{display:flex;flex-wrap:wrap;align-items:stretch;background:#0A0A0A;margin:24px 24px 0}
  .moments a{color:#BDBDBA;text-decoration:none;font:700 14px Inter,sans-serif;padding:13px 16px 10px;border-bottom:3px solid transparent}
  .moments a:hover{color:#fff}
  .moments a[aria-current=page]{color:#fff;border-bottom-color:#FF3C38}
  .moments a.pdf{margin-left:auto;color:#fff;font-weight:800;border-bottom-color:transparent}.moments a.pdf:hover{border-bottom-color:#fff}.moments a.pdf+a.nx{margin-left:6px}
  .moments a.nx{margin-left:auto;color:#FF6A66;font-weight:800}
  .moments a.nx:hover{color:#fff}
  .moments a:focus-visible{outline:3px solid #FF3C38;outline-offset:-3px}
  @media (max-width:900px){.moments{margin:12px 12px 0}.moments a{padding:11px 11px 8px;font-size:13px}.moments a.nx{margin-left:0}}

/* --- map icons, UP/DOWN signs, arrows --- */
.pl .ic{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.pl.dest .ic,.pl.focus .ic,.pl.sel .ic{stroke:var(--pen)}
#pl-eic rect{stroke-width:3.5}
.udchip rect{fill:var(--ink)}.udchip path{stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.udchip text{fill:#fff;font-family:Inter,sans-serif;font-weight:900;font-size:11px;letter-spacing:.04em;text-anchor:start;pointer-events:none}
.chev{pointer-events:none}.chev path{fill:none;stroke:var(--pen);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .35s}
.chev.on path{opacity:.75}
.dg{fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.rule{margin:0 0 16px;padding:8px 0 8px 12px;border-left:3px solid var(--pen);font-size:13.5px;line-height:1.5;color:var(--mid);font-weight:600}
.rule b{color:var(--ink);font-weight:800}
.modes{display:flex;margin:0 0 14px;border:2px solid var(--ink);width:max-content;max-width:100%}
.modes button{display:flex;align-items:center;gap:7px;padding:8px 14px;border:0;background:#fff;color:var(--ink);font:800 14px Inter,sans-serif;cursor:pointer;border-right:2px solid var(--ink)}
.modes button:last-child{border-right:0}
.modes button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.modes button[aria-pressed=true]{background:var(--ink);color:#fff}
.modes button:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.chips .b.long{font-size:15px}
</style>

<script>
/* ---------- City (same Marlow as the Watch) ---------- */
const NS='http://www.w3.org/2000/svg';
const PEN='#FF3C38',INK='#0A0A0A',LIGHT='#E8E8E4';
const RING='M9 31C3 15 27 4 57 4c30 0 41 11 39 24-2 14-30 19-55 18C17 45 4 38 7 25 10 15 24 8 41 6';
const STREETS_H=[{name:'Maple Street',y:150},{name:'Cedar Street',y:300},{name:'Harbor Street',y:450}];
const STREETS_V=[{name:'Oak Avenue',x:240},{name:'River Avenue',x:480},{name:'Station Avenue',x:720}];
const COLS=[[0,222],[258,462],[498,702],[738,960]];
const ROWS=[[0,132],[168,282],[318,432],[468,600]];
const PLACES=[
  [{id:'bus',n:'Bus station'},{id:'park',n:'Linden Park',park:1},{id:'library',n:'Public library'},{id:'train',n:'Train station'}],
  [{id:'market',n:'Supermarket'},{id:'post',n:'Post office'},{id:'cafe',n:'Café'},{id:'museum',n:'Museum'}],
  [{id:'hotel',n:'Hotel'},{id:'mall',n:'Shopping mall',big:1},{id:'bank',n:'Bank'},{id:'cinema',n:'Movie theater'}],
  [{id:'tourist',n:'Tourist office'},{id:'restaurant',n:'Restaurant'},{id:'club',n:'Nightclub'},{id:'eic',n:'EIC'}]
];
/* How each place sounds inside a sentence */
const SAY={bus:'the bus station',park:'Linden Park',library:'the public library',train:'the train station',market:'the supermarket',post:'the post office',cafe:'the café',museum:'the museum',hotel:'the hotel',mall:'the shopping mall',bank:'the bank',cinema:'the movie theater',tourist:'the tourist office',restaurant:'the restaurant',club:'the nightclub',eic:'EIC'};



/* ---------- Draw the map ---------- */
const svg=document.getElementById('map');
function el(t,a,p,txt){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);if(txt!=null)e.textContent=txt;return e;}
const defs=el('defs',{},svg);
const flt=el('filter',{id:'wob',filterUnits:'userSpaceOnUse',x:0,y:0,width:960,height:600},defs);
el('feTurbulence',{type:'fractalNoise',baseFrequency:'0.025',numOctaves:2,seed:4,result:'n'},flt);
el('feDisplacementMap',{in:'SourceGraphic',in2:'n',scale:5},flt);

/* ---------- icons, UP/DOWN signs, mode glyphs ---------- */
const ICONS={"bus": "<rect x=\"4\" y=\"3.5\" width=\"16\" height=\"14\"/><path d=\"M4 10h16M8 17.5v2.5M16 17.5v2.5\"/><circle cx=\"8\" cy=\"14\" r=\".6\"/><circle cx=\"16\" cy=\"14\" r=\".6\"/>", "park": "<circle cx=\"12\" cy=\"9\" r=\"6\"/><path d=\"M12 15v6M9 21h6\"/>", "library": "<path d=\"M3 5.5l9 2 9-2v13l-9 2-9-2z\"/><path d=\"M12 7.5v13\"/>", "train": "<rect x=\"6\" y=\"3\" width=\"12\" height=\"14\"/><path d=\"M6 11h12M9 20.5l-1.5 1M15 20.5l1.5 1M4 21h16\"/><circle cx=\"9.5\" cy=\"14\" r=\".7\"/><circle cx=\"14.5\" cy=\"14\" r=\".7\"/>", "market": "<path d=\"M2 4h3l2.2 11h11l2.3-8H6\"/><circle cx=\"9\" cy=\"19\" r=\"1.5\"/><circle cx=\"17\" cy=\"19\" r=\"1.5\"/>", "post": "<rect x=\"3\" y=\"6\" width=\"18\" height=\"12\"/><path d=\"M3 6l9 7 9-7\"/>", "cafe": "<path d=\"M4.5 8h11v6a4 4 0 0 1-4 4h-3a4 4 0 0 1-4-4z\"/><path d=\"M15.5 9.5h1.5a2.3 2.3 0 0 1 0 4.6h-1.5M8 3.5v2M12 3.5v2\"/>", "museum": "<path d=\"M2.5 9.5L12 3.5l9.5 6zM4.5 20.5h15M5.5 11.5v7M10 11.5v7M14 11.5v7M18.5 11.5v7\"/>", "hotel": "<path d=\"M3 19V6M3 14h18v5M21 14v-3a2 2 0 0 0-2-2h-7v5\"/><circle cx=\"7.5\" cy=\"11\" r=\"1.6\"/>", "mall": "<rect x=\"5\" y=\"8\" width=\"14\" height=\"13\"/><path d=\"M9 8V6.5a3 3 0 0 1 6 0V8\"/>", "bank": "<rect x=\"2.5\" y=\"6\" width=\"19\" height=\"12\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M6 9.5v5M18 9.5v5\"/>", "cinema": "<rect x=\"3\" y=\"10\" width=\"18\" height=\"10\"/><path d=\"M3 10l1.8-5 15.4 3-.7 2M8 6.3l1.6 3.4M13.5 7.3l1.6 3.3\"/>", "tourist": "<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 11v6\"/><circle cx=\"12\" cy=\"7.6\" r=\".6\"/>", "restaurant": "<path d=\"M6 3v7a2 2 0 0 0 2 2v9M10 3v7a2 2 0 0 1-2 2M17 21V3c-2.5 1.5-3 5-3 8h3\"/>", "club": "<circle cx=\"12\" cy=\"13\" r=\"7.5\"/><path d=\"M12 2v3.5M4.5 13h15M12 5.5v15M6.5 8.5q5.5 2.5 11 0M6.5 17.5q5.5-2.5 11 0\"/>", "eic": "<path d=\"M2 9l10-5 10 5-10 5z\"/><path d=\"M6 11.5v5c3 3 9 3 12 0v-5M22 9v6\"/>"};
const GLYPH={"walk": "<circle cx=\"12\" cy=\"5\" r=\"2.6\"/><path d=\"M12 8v7M12 10l-4 4M12 10l4 4M12 15l-3.5 6M12 15l3.5 6\"/>", "bike": "<circle cx=\"6\" cy=\"16\" r=\"3.6\"/><circle cx=\"18\" cy=\"16\" r=\"3.6\"/><path d=\"M6 16l4-8h5l3 8M10 8H8M10 16l5-8\"/>", "drive": "<path d=\"M3 15v-4l2-4h14l2 4v4z\"/><circle cx=\"8\" cy=\"16.5\" r=\"2\"/><circle cx=\"16\" cy=\"16.5\" r=\"2\"/>"};
let MODE='walk';
const VERB={walk:'walk',bike:'ride',drive:'drive'},SPEED={walk:1,bike:.75,drive:.55},LABEL={walk:'Walk',bike:'Bike',drive:'Drive'};
const cap=w=>w[0].toUpperCase()+w.slice(1);
const vtxt=t=>t.replace(/\{V\}/g,cap(VERB[MODE])).replace(/\{v\}/g,VERB[MODE]);
el('rect',{x:0,y:0,width:960,height:600,fill:'#fff'},svg);
STREETS_H.forEach(s=>el('line',{x1:0,x2:960,y1:s.y,y2:s.y,stroke:LIGHT,'stroke-width':1.5,'stroke-dasharray':'10 8'},svg));
STREETS_V.forEach(s=>el('line',{y1:0,y2:600,x1:s.x,x2:s.x,stroke:LIGHT,'stroke-width':1.5,'stroke-dasharray':'10 8'},svg));

const info={},placeEls={};
const OPEN=[0,1,1,2];    /* row 0 opens to Maple, rows 1-2 to Cedar, row 3 to Harbor */
PLACES.forEach((row,r)=>row.forEach((p,c)=>{
  const [x0,x1]=COLS[c],[y0,y1]=ROWS[r];
  el('rect',{x:x0,y:y0,width:x1-x0,height:y1-y0,fill:LIGHT},svg);
  const g=el('g',{class:'pl'+(p.park?' park':''),id:'pl-'+p.id,tabindex:0,role:'button','aria-label':p.n},svg);
  const ins=p.big?8:16;
  el('rect',{x:x0+ins,y:y0+ins,width:x1-x0-2*ins,height:y1-y0-2*ins},g);
  {const ic=el('g',{class:'ic',transform:`translate(${(x0+x1)/2-24} ${(y0+y1)/2-43}) scale(2)`},g);ic.innerHTML=ICONS[p.id];}
  el('text',{x:(x0+x1)/2,y:(y0+y1)/2+30},g,p.n);
  /* label centre kept separate from the dot's stop (info.cx) */
  placeEls[p.id]=g;
  info[p.id]={cx:x1-34,cy:(y0+y1)/2+8,x0,x1,y0,y1,street:STREETS_H[OPEN[r]].y};
}));
STREETS_H.forEach(s=>[111,849].forEach(x=>el('text',{class:'st',x,y:s.y-7},svg,s.name.toUpperCase())));
STREETS_V.forEach(s=>{const px=s.x-7,py=98;el('text',{class:'st',x:px,y:py,transform:`rotate(-90 ${px} ${py})`},svg,s.name.toUpperCase());});


/* ---------- Missions: every step has ONE blank (the preposition) and a consequence for each wrong choice ---------- */
const PT={'out of':'sair de','into':'entrar em','along':'ao longo de','up':'subir','down':'descer','across':'atravessar'};
/* W(dx,dy,len): where the dot goes if the student picks that (wrong) preposition */
const W=(dx,dy,len)=>({dx,dy,len});
const MISSIONS=[
 {to:'cinema',mode:'walk',title:'From EIC to the movie theater',from:'eic',start:[926,542],steps:[
   {s:['Go ',' EIC.'],a:'out of',pts:[[926,542],[926,468]],bad:{'into':W(0,1,45),'along':W(-1,0,120)}},
   {s:['{V} ',' Harbor Street.'],a:'across',pts:[[926,468],[926,432]],bad:{'along':W(-1,0,150),'down':W(0,1,60)}},
   {s:['Now the movie theater is ',''],be:1,face:'up',a:'straight ahead',bad:{'on the left':1,'on the right':1}},
   {s:['Go ',' the movie theater.'],a:'into',pts:[[926,432],[926,383]],bad:{'out of':W(0,1,70),'across':W(-1,0,80)}}]},
 {to:'library',mode:'drive',title:'From EIC to the public library',from:'eic',start:[926,542],steps:[
   {s:['Go ',' EIC.'],a:'out of',pts:[[926,542],[926,450]],bad:{'into':W(0,1,45),'along':W(-1,0,120)}},
   {s:['Turn left and {v} ',' Harbor Street to Station Avenue.'],a:'along',pts:[[926,450],[720,450]],bad:{'across':W(0,-1,80),'down':W(0,1,80)}},
   {s:['Turn right and {v} ',' Station Avenue to Maple Street.'],a:'up',pts:[[720,450],[720,150]],bad:{'down':W(0,1,120),'across':W(1,0,100)}},
   {s:['At Maple Street, the library is ',''],be:1,face:'up',a:'on the left',bad:{'on the right':1,'straight ahead':1}},
   {s:['Turn left and {v} ',' Maple Street to the library.'],a:'along',pts:[[720,150],[668,150]],bad:{'across':W(0,1,90),'up':W(0,-1,80)}},
   {s:['Go ',' the public library.'],a:'into',pts:[[668,150],[668,74]],bad:{'out of':W(0,1,90),'across':W(1,0,90)}}]},
 {to:'market',mode:'bike',title:'From EIC to the supermarket',from:'eic',start:[926,542],steps:[
   {s:['Go ',' EIC.'],a:'out of',pts:[[926,542],[926,450]],bad:{'into':W(0,1,45),'along':W(1,0,0)}},
   {s:['Turn left and {v} ',' Harbor Street to Oak Avenue.'],a:'along',pts:[[926,450],[240,450]],bad:{'across':W(0,-1,80),'up':W(0,-1,80)}},
   {s:['Turn right and {v} ',' Oak Avenue to Cedar Street.'],a:'up',pts:[[240,450],[240,300]],bad:{'down':W(0,1,100),'across':W(1,0,100)}},
   {s:['At Cedar Street, the supermarket is ',''],be:1,face:'up',a:'on the left',bad:{'on the right':1,'straight ahead':1}},
   {s:['Turn left and {v} ',' Cedar Street to the supermarket.'],a:'along',pts:[[240,300],[188,300]],bad:{'across':W(0,1,60),'down':W(0,1,60)}},
   {s:['Go ',' the supermarket.'],a:'into',pts:[[188,300],[188,233]],bad:{'out of':W(0,1,60),'across':W(1,0,60)}}]},
 {to:'bank',mode:'walk',title:'From the train station to the bank',from:'train',start:[926,74],steps:[
   {s:['Go ',' the train station.'],a:'out of',pts:[[926,74],[926,150]],bad:{'into':W(0,-1,40),'along':W(-1,0,120)}},
   {s:['Turn right and {v} ',' Maple Street to Station Avenue.'],a:'along',pts:[[926,150],[720,150]],bad:{'across':W(0,1,80),'up':W(0,-1,80)}},
   {s:['Turn left and {v} ',' Station Avenue to Harbor Street.'],a:'down',pts:[[720,150],[720,450]],bad:{'up':W(0,-1,120),'across':W(1,0,100)}},
   {s:['At Harbor Street, the bank is ',''],be:1,face:'down',a:'on the right',bad:{'on the left':1,'straight ahead':1}},
   {s:['Turn right and {v} ',' Harbor Street to the bank.'],a:'along',pts:[[720,450],[668,450]],bad:{'across':W(0,-1,80),'down':W(0,1,80)}},
   {s:['Go ',' the bank.'],a:'into',pts:[[668,450],[668,383]],bad:{'out of':W(0,1,60),'across':W(1,0,60)}}]}
];
/* first mission is the short one, the others come in a different order each time */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
let order=[0,...shuffle([1,2,3])];

/* ---------- Draw the map ---------- */

const doneTrail=el('path',{d:'M0 0',fill:'none',stroke:PEN,'stroke-width':5,'stroke-linecap':'round','stroke-linejoin':'round',filter:'url(#wob)',style:'pointer-events:none'},svg);
/* trail, dot and tag */
const route=el('path',{d:'M0 0',fill:'none',stroke:PEN,'stroke-width':5,'stroke-linecap':'round','stroke-linejoin':'round',filter:'url(#wob)',style:'pointer-events:none'},svg);

/* UP / DOWN signs at both ends of every avenue, and the orange arrows that show the direction */
STREETS_V.forEach(s=>{
  const up=el('g',{class:'udchip',transform:`translate(${s.x-32} 6)`},svg);
  el('rect',{x:0,y:0,width:64,height:22},up);el('path',{d:'M9 15l5-8 5 8'},up);el('text',{x:25,y:16},up,'UP');
  const dn=el('g',{class:'udchip',transform:`translate(${s.x-32} 572)`},svg);
  el('rect',{x:0,y:0,width:64,height:22},dn);el('path',{d:'M9 7l5 8 5-8'},dn);el('text',{x:25,y:16},dn,'DOWN');
});
const chev=el('g',{class:'chev'},svg);
STREETS_V.forEach(s=>{for(let y=90;y<=560;y+=47)el('path',{d:`M${s.x-9} ${y+6} l9 -11 l9 11`},chev);});
function showUD(dir){chev.classList.toggle('on',!!dir);chev.setAttribute('transform',dir==='down'?'rotate(180 480 300)':'');}
const dot=el('circle',{r:9,fill:INK,stroke:'#fff','stroke-width':3,style:'pointer-events:none'},svg);

const dotG=el('g',{class:'dg',style:'pointer-events:none'},svg);
dot.setAttribute('r',15);
const _sa=dot.setAttribute.bind(dot);
dot.setAttribute=(k,v)=>{_sa(k,v);if(k==='cx'||k==='cy')dotG.setAttribute('transform','translate('+((+dot.getAttribute('cx')||0)-11)+' '+((+dot.getAttribute('cy')||0)-11)+') scale(.92)');};
function setMode(m){MODE=m;dotG.innerHTML=GLYPH[m];}
setMode('walk');
const tagT=el('text',{id:'tagT'},svg);
let total=0;
function setRoute(pts){route.setAttribute('d','M'+pts.map(p=>p.join(' ')).join(' L'));total=route.getTotalLength();}
function snap(dist){
  const p=route.getPointAtLength(dist);
  dot.setAttribute('cx',p.x);dot.setAttribute('cy',p.y);
  route.setAttribute('stroke-dasharray',dist+' '+(total+10));
  placeTag(p);
}
function placeTag(p){
  const w=tagT.textContent?tagT.getBBox().width:0;
  const x=p.x>740?p.x-16-w:p.x+16,y=p.y-20;
  tagT.setAttribute('x',x);tagT.setAttribute('y',y);tagT.setAttribute('transform','rotate(-4 '+x+' '+y+')');
}
function showTag(txt){tagT.style.opacity=txt?1:0;tagT.textContent=txt||'';placeTag({x:+dot.getAttribute('cx')||0,y:+dot.getAttribute('cy')||0});}
function putDot(id){
  const i=info[id];
  route.setAttribute('d','M'+i.cx+' '+i.cy+' L'+i.cx+' '+(i.cy+.01));total=.01;
  route.setAttribute('stroke-dasharray','0 10');
  dot.setAttribute('cx',i.cx);dot.setAttribute('cy',i.cy);showTag('');
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const REDUCED=matchMedia('(prefers-reduced-motion:reduce)').matches;
function animate(a,b,dur){
  return new Promise(res=>{
    if(REDUCED){snap(b);res();return;}
    const t0=performance.now();
    (function f(t){
      const k=Math.min(1,(t-t0)/dur);
      const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
      snap(a+(b-a)*e);
      if(k<1)requestAnimationFrame(f);else res();
    })(t0);
  });
}

function ptsLen(p){let L=0;for(let i=1;i<p.length;i++)L+=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);return L;}
async function run(pts,dur){setRoute(pts);await animate(0,total,(dur||Math.min(2200,Math.max(700,total/420*1000)))*SPEED[MODE]);return total;}
async function back(len){await animate(len,0,Math.min(900,Math.max(450,len/700*1000)));}

/* ---------- Panel ---------- */
const panel=document.getElementById('panel');
const RINGSVG='<svg class="wr" viewBox="0 0 100 50" preserveAspectRatio="none" aria-hidden="true"><path pathLength="1" d="'+RING+'"/></svg>';
let mi=0,si=0,locked=false,doneD='';
const M=()=>MISSIONS[order[mi]];

function stepHTML(st,k){
  const cls=k<si?'ok':(k===si?'on':'');
  const gap=k<si?`<span class="w on">${st.a}${RINGSVG}</span>`:'<span class="gap"></span>';
  const A=st.a;
  let chips='';
  if(k===si){
    const opts=shuffle([st.a,...Object.keys(st.bad)]);
    chips='<div class="chips">'+opts.map(o=>`<button class="b${st.be?' long':''}" data-p="${o}">${o}</button>`).join('')+'</div>';
  }
  return `<li class="${cls}"><span class="n">${k+1}</span><span class="s">${vtxt(st.s[0])}${gap}${vtxt(st.s[1])}${st.be?'.':''}</span>${chips}</li>`;
}
function render(note){
  const m=M();
  const finished=si>=m.steps.length;
  const last=mi===order.length-1;
  panel.innerHTML=
   `<p class="eyebrow" style="display:flex;gap:10px;align-items:center;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mid);margin:0 0 14px"><span style="width:24px;height:3px;background:var(--pen)"></span>Marlow · Be the GPS · Drive</p>
    <ol class="steps"><li><span class="n">1</span><span>Choose how you move.</span></li><li><span class="n">2</span><span>Read the direction and choose the missing word.</span></li><li><span class="n">3</span><span>Watch the dot. It does what you say.</span></li></ol>
    <div class="modes" role="group" aria-label="How do you move?">${['walk','bike','drive'].map(k=>`<button type="button" data-m="${k}" aria-pressed="${k===MODE}"><svg viewBox="0 0 24 24" aria-hidden="true">${GLYPH[k]}</svg>${LABEL[k]}</button>`).join('')}</div>
    <p class="rule"><b>across</b> = from one side to the other. <b>along</b> = on the street, following it. <b>up / down</b> = the avenue goes toward the UP or DOWN sign.</p>
    <h1><small>Mission ${mi+1} of ${order.length}</small>${m.title}</h1>
    <ol class="dirs">${m.steps.map(stepHTML.bind(null)).join('')}</ol>
    <p class="pen fb" id="fb">${finished?'You made it!':(note||'')}</p>
    <div class="controls" style="margin-top:auto;padding-top:16px">
      <button class="b" id="again">Restart mission</button>
      <button class="b" id="next" ${finished?'':'disabled'}>${last?'Done':'Next mission'}</button>
    </div>`;
  panel.querySelectorAll('.chips .b').forEach(b=>b.onclick=()=>choose(b.dataset.p));
  panel.querySelectorAll('.modes button').forEach(b=>b.onclick=()=>{setMode(b.dataset.m);render(note);});
  document.getElementById('again').onclick=()=>startMission();
  document.getElementById('next').onclick=()=>{if(mi<order.length-1){mi++;startMission();}else{mi=0;order=[0,...shuffle([1,2,3])];startMission();}};
}
function startMission(){
  const m=M();si=0;locked=false;doneD='';setMode(m.mode);showUD(null);
  doneTrail.setAttribute('d','M0 0');
  Object.values(placeEls).forEach(g=>g.classList.remove('dest','focus'));
  placeEls[m.to].classList.add('dest');
  const i=info[m.from];
  setRoute([m.start,[m.start[0],m.start[1]+.01]]);snap(0);
  dot.setAttribute('cx',m.start[0]);dot.setAttribute('cy',m.start[1]);
  route.setAttribute('stroke-dasharray','0 10');showTag('');
  render();
}
async function choose(p){
  if(locked)return;
  const m=M(),st=m.steps[si];
  locked=true;
  if(st.be){
    if(p===st.a){si++;locked=false;render();return;}
    const msg='Look at the map. You are going '+st.face.toUpperCase()+'. What is on your left? And on your right?';
    document.getElementById('fb').textContent=msg;locked=false;render(msg);return;
  }
  if(p===st.a){
    await run(st.pts);
    doneD+=' M'+st.pts.map(q=>q.join(' ')).join(' L');
    doneTrail.setAttribute('d',doneD);
    showUD(st.a==='up'||st.a==='down'?st.a:null);
    si++;locked=false;
    if(si>=m.steps.length){placeEls[m.to].classList.add('focus');showTag('');}
    render();
    return;
  }
  const b=st.bad[p],S=st.pts[0];
  const len=Math.max(b.len,0.5);
  await run([S,[S[0]+b.dx*len,S[1]+b.dy*len]],900);
  showTag(p);
  const msg='“'+p+'” = '+PT[p]+'. Look where the dot went.';
  document.getElementById('fb').textContent=msg;
  await wait(REDUCED?500:1300);
  showTag('');
  await back(len);
  setRoute([S,[S[0],S[1]+.01]]);snap(0);
  locked=false;
  render(msg);
}

order=[0,...shuffle([1,2,3])];
startMission();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>showTag(tagT.textContent));
</script>
</body>
