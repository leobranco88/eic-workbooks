<style>
:root{--ink:#0A0A0A;--mid:#545454;--light:#E8E8E4;--white:#fff;--blue:#0D1FFF;--orange:#FF3C38;--bad:#F5006A;--neon:#F2FF3D;--graf:#4A4E54}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);line-height:1.5;font-size:clamp(15px,.5vw + 11px,18px);-webkit-font-smoothing:antialiased}
.nav{display:flex;align-items:center;gap:16px;padding:12px clamp(20px,4vw,64px);border-bottom:1.5px solid var(--ink)}
.nav img{height:30px}.nav b{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:800}.nav .mode{margin-left:auto;font-size:13px;font-weight:600;color:var(--mid)}
main{padding:0 clamp(20px,4vw,64px) 100px}
.top{padding:clamp(28px,4vw,64px) 0 28px;border-bottom:2px solid var(--ink);display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mid);margin-bottom:12px}
.eyebrow::before{content:'';width:24px;height:3px;background:var(--orange)}
h1{font-size:clamp(38px,4.2vw + 20px,96px);font-weight:900;letter-spacing:-.03em;line-height:1}
.meta{color:var(--mid);font-size:14px;margin-top:10px}
.big{display:flex;gap:36px}
.big div{font-size:12px;font-weight:600;color:var(--mid);max-width:11ch}
.big strong{display:block;font-size:clamp(34px,3.4vw,56px);font-weight:900;color:var(--ink);line-height:1;letter-spacing:-.03em;margin-bottom:4px}
section{padding:40px 0;border-bottom:1px solid var(--light)}
h2{font-size:clamp(24px,2vw + 15px,44px);font-weight:900;letter-spacing:-.02em;line-height:1.05}
.sub{color:var(--mid);font-size:.9em;margin:8px 0 20px;padding-left:12px;border-left:2px solid var(--light)}
.start{list-style:none;border-top:2px solid var(--ink)}
.start li{display:grid;grid-template-columns:130px 1fr;gap:16px;padding:14px 0;border-bottom:1px solid var(--light);align-items:baseline}
.pen{font-family:Caveat,cursive;font-weight:700;color:var(--blue);line-height:1;display:inline-block;transform:rotate(-3deg)}
.start .pen{font-size:34px}
.start .ans{display:block;color:var(--mid);font-size:.85em;margin-top:2px}
.empty{color:var(--mid);padding:16px 0}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mid);font-weight:800;padding:0 14px 8px 0;border-bottom:2px solid var(--ink)}
td{padding:14px 14px 14px 0;border-top:1px solid var(--light);vertical-align:top}
td.n{font-weight:900;font-size:20px;width:40px}
td.s{width:34%;font-weight:600}
td.s small{display:block;color:var(--mid);font-weight:400;margin-top:3px;font-size:.85em}
.try{display:block}
.try.bad{color:var(--mid);text-decoration:line-through;text-decoration-color:var(--bad);text-decoration-thickness:2px}
.try.good{font-weight:800}
.try.rev{font-family:Caveat,cursive;font-weight:700;font-size:1.4em;color:var(--graf);line-height:1.1}
.num{white-space:nowrap}
.state{font-weight:700;font-size:13px}
.state .pen{font-size:24px;margin-left:6px}
.state.rev{color:var(--graf)}.state.open{color:var(--mid);font-weight:500}
.txt{white-space:pre-wrap;font-size:1.02em;line-height:1.7;padding:14px 0 6px}
.txt mark{background:var(--neon);mix-blend-mode:multiply;padding:0 2px;border-radius:3px 7px 4px 6px}
.q{font-weight:800;font-size:1.1em;letter-spacing:-.01em}
.ans-block{border-top:1px solid var(--light);padding:20px 0}
.ans-block:first-of-type{border-top:2px solid var(--ink)}
.chips{font-size:13px;color:var(--mid);display:flex;gap:18px;flex-wrap:wrap;margin-top:4px}
.chips b{color:var(--ink)}
.found{margin-top:4px}
.found .pen{font-size:24px}
.draft{font-family:Caveat,cursive;font-weight:700;color:var(--bad);font-size:22px}
@media(max-width:820px){.top{grid-template-columns:1fr}.start li{grid-template-columns:1fr}table,tbody,tr,td{display:block;width:100%!important}thead{display:none}tr{border-top:2px solid var(--ink);padding:10px 0}td{border:0;padding:2px 0}}
</style>
</head>

<script>
/* EIC · gravação das respostas (Firestore, com modo demonstração).
   Para ligar ao Firestore, cole a configuração do projeto em EIC_FIREBASE_CONFIG.
   Sem configuração, tudo fica no localStorage do navegador (serve só para testar). */
(function () {
  var CFG = window.EIC_FIREBASE_CONFIG || null;
  var COLLECTION = 'neural_praticas'; // neural_praticas/{aluna}/respostas/{auto}
  var LS = 'eic_vp2_';
  var fb = null;

  function lsGet(k, d) { try { return JSON.parse(localStorage.getItem(LS + k)) || d; } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(LS + k, JSON.stringify(v)); } catch (e) {} }

  // O Firebase entra sob demanda: se o CDN cair, a página continua funcionando.
  function load() {
    if (fb) return fb;
    var base = 'https://www.gstatic.com/firebasejs/10.14.1/';
    fb = import(base + 'firebase-app.js').then(function (a) {
      return import(base + 'firebase-firestore.js').then(function (f) {
        var app = a.initializeApp(CFG);
        return { db: f.getFirestore(app), f: f };
      });
    });
    return fb;
  }

  function sendPending(aluna) {
    var q = lsGet('pending_' + aluna, []);
    if (!q.length || !CFG) return Promise.resolve();
    lsSet('pending_' + aluna, []);
    return Promise.all(q.map(function (r) { return write(aluna, r); }));
  }

  function write(aluna, rec) {
    return load().then(function (x) {
      return x.f.addDoc(x.f.collection(x.db, COLLECTION, aluna, 'respostas'), rec);
    }).catch(function () {
      var q = lsGet('pending_' + aluna, []);
      q.push(rec);
      lsSet('pending_' + aluna, q);
      throw new Error('offline');
    });
  }

  window.EICStore = {
    mode: CFG ? 'firestore' : 'local',
    save: function (aluna, rec) {
      rec.ts = Date.now();
      if (!CFG) {
        var all = lsGet('log_' + aluna, []);
        all.push(rec);
        lsSet('log_' + aluna, all);
        return Promise.resolve('local');
      }
      return sendPending(aluna).then(function () { return write(aluna, rec); }).then(function () { return 'ok'; });
    },
    watch: function (aluna, cb) {
      if (!CFG) {
        var run = function () { cb(lsGet('log_' + aluna, [])); };
        run();
        window.addEventListener('storage', run);
        return;
      }
      load().then(function (x) {
        var f = x.f;
        var q = f.query(f.collection(x.db, COLLECTION, aluna, 'respostas'), f.orderBy('ts'));
        f.onSnapshot(q, function (snap) {
          cb(snap.docs.map(function (d) { return d.data(); }));
        });
      }).catch(function (e) { console.warn('EIC: sem conexão com o Firestore', e); });
    }
  };
})();

</script>

<script>
(function(){
var ALUNA=(new URLSearchParams(location.search).get('aluna')||'vitoria').toLowerCase().replace(/[^a-z0-9_-]/g,'');
var NOMES={vitoria:'Vitória'};
document.getElementById('nome').textContent=NOMES[ALUNA]||ALUNA;
document.getElementById('mode').textContent=EICStore.mode==='firestore'?'Ao vivo · Firestore':'Modo teste · lendo só deste navegador';
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function fmt(ms){if(ms==null)return '–';var s=Math.round(ms/1000);return s<60?s+' s':Math.floor(s/60)+' min '+(s%60)+' s';}
function dt(ts){var d=new Date(ts);return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' às '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});}
function itemText(ex,i){
  if(ex===1){var a=EX1.items[i];return {t:esc(a.pre)+' <b>___</b> '+esc(a.post),a:a.accept[0],pt:a.pt};}
  if(ex===2){var b=EX2.items[i];return {t:esc(b.pre)+' <b>___</b> '+esc(b.post),a:b.opts[b.right],pt:b.pt};}
  var c=EX3.items[i];return {t:esc(c.pt),a:c.model,pt:''};
}
function mark(text,found){
  var h=esc(text);
  (found||[]).forEach(function(f){var e=esc(f).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');h=h.replace(new RegExp(e,'i'),function(m){return '<mark>'+m+'</mark>';});});
  return h;
}
var TIT={1:'Fill the gap · Lacuna',2:'Choose the verb · Escolha',3:'Say it in English · Dizer em inglês'};
function render(log){
  var by={1:{},2:{},3:{},4:{},5:{}},first=null,last=null,nOk1=0,nErr=0,nRev=0;
  log.forEach(function(r){
    if(!r.ex)return; first=first||r.ts; last=r.ts;
    var o=by[r.ex][r.item]=by[r.ex][r.item]||{rows:[]}; o.rows.push(r);
  });
  var scored=[];
  [1,2,3].forEach(function(ex){
    var n=ex===1?EX1.items.length:ex===2?EX2.items.length:EX3.items.length;
    var html='<h2>Exercício '+ex+' · '+TIT[ex]+'</h2><div class="sub">O que ela escreveu, na ordem. Riscado é erro.</div><table><thead><tr><th>#</th><th>Frase</th><th>O que ela respondeu</th><th>Tentativas</th><th>Tempo</th><th>Situação</th></tr></thead><tbody>';
    for(var i=1;i<=n;i++){
      var o=by[ex][i],tx=itemText(ex,i-1),tries='',state='<span class="state open">Ainda não fez</span>',tp='–',nt='–',err=0,rev=false;
      if(o){
        var rs=o.rows;
        rs.forEach(function(r){
          if(r.rev){rev=true;tries+='<span class="try rev">'+'Abriu a resposta'+'</span>';}
          else if(r.ok)tries+='<span class="try good">'+esc(r.resp)+'</span>';
          else{err++;tries+='<span class="try bad">'+esc(r.resp)+'</span>';}
        });
        var lr=rs[rs.length-1]; nt=rs.filter(function(r){return !r.rev;}).length; tp=fmt(lr.ms);
        var done=rs.some(function(r){return r.ok;});
        if(rev){state='<span class="state rev">'+'Abriu a resposta depois de '+lr.tries+' tentativas'+'</span>';nRev++;}
        else if(done){state='<span class="state">'+(err===0?'Acertou de primeira<span class="pen">Yes!</span>':'Acertou depois de '+err+' erro'+(err>1?'s':''))+'</span>';if(err===0)nOk1++;}
        else state='<span class="state open">Em andamento</span>';
        nErr+=err;
        if(err>0||rev)scored.push({ex:ex,i:i,err:err,rev:rev,tx:tx});
      }
      html+='<tr><td class="n">'+i+'</td><td class="s">'+tx.t+(tx.pt?'<small>'+esc(tx.pt)+'</small>':'')+'</td><td>'+(tries||'–')+'</td><td class="num">'+nt+'</td><td class="num">'+tp+'</td><td>'+state+'</td></tr>';
    }
    html+='</tbody></table>';
    document.getElementById('s'+ex).innerHTML=html;
  });
  /* 4 e 5: texto livre, sempre a última versão */
  function openHtml(ex,title,items){
    var html='<h2>'+title+'</h2><div class="sub">A última versão de cada resposta. O marca-texto mostra estruturas de hoje que o programa achou; o programa pode errar, então confira lendo.</div>';
    items.forEach(function(q,idx){
      var o=by[ex][idx+1],blk='<div class="ans-block"><div class="q">'+(items.length>1?(idx+1)+'. ':'')+esc(q)+'</div>';
      if(!o)blk+='<div class="empty">Ainda não escreveu.</div>';
      else{
        var l=o.rows[o.rows.length-1],isDraft=l.draft;
        blk+='<div class="txt">'+mark(l.resp,l.found)+'</div><div class="chips"><span><b>'+(l.words||0)+'</b> palavras</span><span>'+(l.found||[]).length+' estrutura(s) achada(s)</span><span>'+fmt(l.ms)+'</span><span>'+dt(l.ts)+'</span>'+(isDraft?'<span class="draft">Rascunho, ainda não salvou</span>':'<span><b>Salvo por ela</b></span>')+'</div>';
      }
      html+=blk+'</div>';
    });
    document.getElementById('s'+ex).innerHTML=html;
  }
  openHtml(4,'Exercício 4 · Your answer · Dissertativas',EX4.items.map(function(x){return x.q;}));
  openHtml(5,'Exercício 5 · '+EX5.title+' · E-mail',[EX5.brief]);
  document.getElementById('nAcertos').textContent=nOk1;
  document.getElementById('nErros').textContent=nErr;
  document.getElementById('nVer').textContent=nRev;
  document.getElementById('meta').textContent=first?('Primeira resposta em '+dt(first)+' · Última em '+dt(last)):'Ela ainda não respondeu nada.';
  scored.sort(function(a,b){return (b.err+(b.rev?2:0))-(a.err+(a.rev?2:0));});
  var ul=document.getElementById('start');
  if(!scored.length){ul.innerHTML='<li><div></div><div class="empty">Nada para retomar ainda.</div></li>';return;}
  ul.innerHTML=scored.slice(0,5).map(function(s){
    var k=s.rev?'Abriu':s.err+(s.err>1?' erros':' erro');
    return '<li><div class="pen">'+k+'</div><div>Exercício '+s.ex+', item '+s.i+': '+s.tx.t+'<span class="ans">Resposta: '+esc(s.tx.a)+'</span></div></li>';
  }).join('');
}
EICStore.watch(ALUNA,render);
})();
</script>
