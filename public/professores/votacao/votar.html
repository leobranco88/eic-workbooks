:root { --ink:#111; --soft:#5a5a5a; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html { font-size:17px; }
body { margin:0; background:#fff; color:var(--ink); font-family:Inter,"Helvetica Neue",Arial,sans-serif; line-height:1.4; }
.wrap { max-width:34rem; margin:0 auto; padding:1.1rem 1.1rem 9rem; }
.top { display:flex; justify-content:space-between; align-items:center; font-size:.62rem; letter-spacing:.08em; text-transform:uppercase; font-weight:700; border-bottom:1px solid #000; padding-bottom:.55rem; }
h1 { font-size:1.9rem; line-height:1.1; letter-spacing:-.02em; font-weight:800; margin:1.6rem 0 .5rem; }
.sub { margin:0 0 1.4rem; font-size:1rem; }
ul { list-style:none; margin:0; padding:0; border-top:2px solid #000; }
li { margin:0; }
button.opt { display:grid; grid-template-columns:2.3rem 1fr; gap:.9rem; align-items:center; width:100%; min-height:4.2rem; text-align:left; font:inherit; color:inherit; background:#fff; border:0; border-bottom:1px solid #000; padding:.75rem .5rem; cursor:pointer; }
button.opt .ltr { width:2.3rem; height:2.3rem; display:grid; place-items:center; border:2px solid #000; font-weight:800; }
button.opt b { display:block; font-size:1.02rem; line-height:1.25; }
button.opt small { display:block; font-size:.8rem; color:var(--soft); margin-top:.15rem; line-height:1.3; }
button.opt[aria-checked="true"] { background:#000; color:#fff; }
button.opt[aria-checked="true"] small { color:#cfcfcf; }
button.opt[aria-checked="true"] .ltr { border-color:#fff; background:#fff; color:#000; }
button.opt[aria-disabled="true"] { opacity:.38; cursor:default; }
button:focus-visible, input:focus-visible { outline:3px solid #000; outline-offset:-3px; }
.idea { margin-top:1.6rem; }
.idea label { display:block; font-size:.62rem; letter-spacing:.08em; text-transform:uppercase; font-weight:700; }
.idea input { width:100%; font:inherit; font-size:1rem; border:0; border-bottom:1px solid #000; padding:.6rem 0; background:transparent; border-radius:0; }
.bar { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:2px solid #000; padding:.8rem 1.1rem calc(.8rem + env(safe-area-inset-bottom)); }
.bar .in { max-width:34rem; margin:0 auto; }
.count { font-size:.82rem; font-weight:700; margin-bottom:.55rem; display:flex; justify-content:space-between; }
.count span:last-child { font-weight:400; color:var(--soft); }
button.send { display:block; width:100%; font:inherit; font-weight:800; font-size:1.05rem; color:#fff; background:#000; border:2px solid #000; padding:.95rem 1rem; cursor:pointer; }
button.send:disabled { background:#fff; color:#8a8a8a; border-color:#bdbdbd; cursor:default; }
.msg { font-size:.85rem; margin:.55rem 0 0; min-height:1.2em; }
.msg.err { font-weight:700; }
.done { display:none; }
.done h1 { margin-top:2.2rem; }
.done .picked { border-top:2px solid #000; margin-top:1.4rem; }
.done .picked div { display:flex; gap:.9rem; align-items:center; padding:.8rem .2rem; border-bottom:1px solid #000; }
.done .picked .ltr { width:2.1rem; height:2.1rem; display:grid; place-items:center; background:#000; color:#fff; font-weight:800; flex:none; }
.done a.change { display:inline-block; margin-top:1.4rem; font-size:.9rem; color:#000; }
.demo { background:#000; color:#fff; font-size:.7rem; text-align:center; padding:.3rem; display:none; }
@media (max-width:420px) { .top span:last-child { display:none; } }
@media (prefers-reduced-motion: no-preference) { button.opt, button.send { transition:background .12s, color .12s; } }
.logo { height:3.1rem; width:auto; display:block; }
</style>
</head>

<script>/* EIC · votação da reunião de professores (Firestore: reuniaoPoll/{sid}/votes/{id}).
   ?s=nome troca a rodada (começa do zero). ?demo usa só o localStorage (para testar). */
(function () {
  var CFG = window.EIC_FIREBASE_CONFIG || null;
  var qs = new URLSearchParams(location.search);
  var SID = qs.get('s') || 'treinamentos-2026-11-18';
  var DEMO = qs.has('demo') || !CFG;
  var P = 'eic_reuniao_' + SID + '_';
  var fb = null;

  function lsGet(k, d) { try { var v = localStorage.getItem(P + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(P + k, JSON.stringify(v)); } catch (e) {} }

  function load() {
    if (fb) return fb;
    var base = 'https://www.gstatic.com/firebasejs/10.14.1/';
    fb = import(base + 'firebase-app.js').then(function (a) {
      return import(base + 'firebase-firestore.js').then(function (f) {
        var app = a.initializeApp(CFG);
        return { db: f.getFirestore(app), f: f };
      });
    });
    return fb;
  }

  window.Poll = {
    sid: SID,
    demo: DEMO,
    me: function () { return lsGet('me', null); },
    setMe: function (m) { lsSet('me', m); },
    send: function (id, rec) {
      rec.ts = Date.now();
      if (DEMO) {
        var all = lsGet('demo_votes', {});
        all[id] = rec;
        lsSet('demo_votes', all);
        return Promise.resolve();
      }
      return load().then(function (x) {
        return x.f.setDoc(x.f.doc(x.db, 'reuniaoPoll', SID, 'votes', id), rec);
      });
    },
    watch: function (cb) {
      if (DEMO) {
        var run = function () { var o = lsGet('demo_votes', {}); cb(Object.keys(o).map(function (k) { return o[k]; })); };
        run();
        window.addEventListener('storage', run);
        return;
      }
      load().then(function (x) {
        x.f.onSnapshot(x.f.collection(x.db, 'reuniaoPoll', SID, 'votes'),
          function (s) { cb(s.docs.map(function (d) { return d.data(); })); },
          function (e) { cb(null, e); });
      }).catch(function (e) { cb(null, e); });
    }
  };
})();
</script>
<script>
(function () {
  var OPTS = [
    ["A", "Writing correction, hands-on", "Correcting real texts together, the same way."],
    ["B", "Scoring speaking and writing", "Everyone scores the same sample, then we compare."],
    ["C", "Reading and Listening tools", "Teaching reading and listening, not just projecting the text."],
    ["D", "Pronunciation (American English)", "Sounds in syllables, for you and for your students."],
    ["E", "Your own English", "Natural, idiomatic American English, in short sessions."],
    ["F", "Peer observation", "Watch a colleague’s class for 20 minutes and take one idea."],
    ["G", "Parent conversations", "How to talk about a student’s progress in the parents’ meeting."]
  ];
  var MAX = 3, sel = [];
  var $ = function (id) { return document.getElementById(id); };
  var list = $('list'), send = $('send'), msg = $('msg');
  if (window.Poll.demo) $('demo').style.display = 'block';

  OPTS.forEach(function (o) {
    var li = document.createElement('li');
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'opt'; b.setAttribute('role', 'checkbox');
    b.setAttribute('aria-checked', 'false'); b.dataset.l = o[0];
    b.innerHTML = '<span class="ltr">' + o[0] + '</span><span><b></b><small></small></span>';
    b.querySelector('b').textContent = o[1];
    b.querySelector('small').textContent = o[2];
    b.addEventListener('click', function () { toggle(o[0]); });
    li.appendChild(b); list.appendChild(li);
  });

  function toggle(l) {
    var i = sel.indexOf(l);
    if (i >= 0) sel.splice(i, 1);
    else if (sel.length < MAX) sel.push(l);
    paint();
  }
  function paint() {
    list.querySelectorAll('button.opt').forEach(function (b) {
      var on = sel.indexOf(b.dataset.l) >= 0;
      b.setAttribute('aria-checked', on ? 'true' : 'false');
      b.setAttribute('aria-disabled', (!on && sel.length >= MAX) ? 'true' : 'false');
    });
    $('cnt').textContent = sel.length + ' of ' + MAX + ' chosen';
    $('hint').textContent = sel.length >= MAX ? 'Ready to send' : 'Tap to choose';
    send.disabled = sel.length !== MAX;
    msg.textContent = ''; msg.className = 'msg';
  }

  function showDone(choices) {
    $('pick').style.display = 'none'; $('bar').style.display = 'none';
    $('done').style.display = 'block';
    var box = $('picked'); box.innerHTML = '';
    choices.forEach(function (l) {
      var o = OPTS.filter(function (x) { return x[0] === l; })[0];
      var d = document.createElement('div');
      d.innerHTML = '<span class="ltr"></span><span></span>';
      d.firstChild.textContent = l; d.lastChild.textContent = o ? o[1] : l;
      box.appendChild(d);
    });
    window.scrollTo(0, 0);
  }

  var me = window.Poll.me();
  function newId() {
    var a = new Uint8Array(10);
    (window.crypto || window.msCrypto).getRandomValues(a);
    return Array.prototype.map.call(a, function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
  }
  if (me && me.choices) { showDone(me.choices); }

  $('change').addEventListener('click', function (e) {
    e.preventDefault();
    sel = me && me.choices ? me.choices.slice() : [];
    $('done').style.display = 'none'; $('pick').style.display = 'block'; $('bar').style.display = 'block';
    paint(); window.scrollTo(0, 0);
  });

  send.addEventListener('click', function () {
    if (sel.length !== MAX) return;
    var id = (me && me.id) || newId();
    var rec = { choices: sel.slice() };
    var idea = $('idea').value.trim();
    if (idea) rec.idea = idea.slice(0, 160);
    send.disabled = true; send.textContent = 'Sending…'; msg.textContent = ''; msg.className = 'msg';
    var timeout = new Promise(function (_, rej) { setTimeout(function () { rej(new Error('timeout')); }, 12000); });
    Promise.race([window.Poll.send(id, rec), timeout]).then(function () {
      me = { id: id, choices: sel.slice() };
      window.Poll.setMe(me);
      send.textContent = 'Send my vote';
      showDone(me.choices);
    }).catch(function () {
      send.disabled = false; send.textContent = 'Send my vote';
      msg.className = 'msg err';
      msg.textContent = 'Not confirmed yet. Check your internet and tap Send again.';
    });
  });
  paint();
})();
</script>
