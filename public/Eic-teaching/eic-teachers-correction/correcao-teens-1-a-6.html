:root{--ink:#0A0A0A;--mid:#545454;--light:#E8E8E4;--blue:#0D1FFF;--orange:#FF3C38;--bad:#F5006A;--neon:#F2FF3D;--pen:#1B2F8A}
*{box-sizing:border-box}html,body{margin:0;background:#fff;color:var(--ink);font-family:Inter,system-ui,sans-serif}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:#fff;border:1.5px solid var(--ink);padding:10px 16px;cursor:pointer;font-weight:700}
button:hover{background:#F4F4F1}button[aria-pressed=true],button.on{background:var(--ink);color:#fff}
.top{display:flex;align-items:center;gap:22px;padding:10px clamp(18px,3vw,56px);border-bottom:2px solid var(--ink);position:sticky;top:0;background:#fff;z-index:5;flex-wrap:wrap}
.top svg{height:38px;width:auto}
.stu{display:flex;gap:8px;flex-wrap:wrap;flex:1}
.stu button{display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:8px 14px;line-height:1.15}
.stu button small{font-size:12px;font-weight:600;color:var(--mid)}.stu button.on small{color:#cfcfcf}
.tools{display:flex;gap:8px}
.wrap{padding:clamp(14px,1.6vw,28px) clamp(18px,3vw,56px) 80px}
.eyebrow{font-size:clamp(12px,.9vw,16px);font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--mid)}
h1{font-size:clamp(30px,3vw,58px);font-weight:900;letter-spacing:-.035em;line-height:1;margin:4px 0 8px}
.task{border:1.5px solid var(--ink);padding:12px 18px;font-size:clamp(16px,1.35vw,24px);font-weight:800;margin:8px 0 0;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.task span{font-weight:600;color:var(--mid);font-size:.8em}
.views{display:flex;gap:8px;margin:14px 0 14px;flex-wrap:wrap;align-items:center}
.views .sp{flex:1}
.grid{display:grid;grid-template-columns:minmax(0,1fr) clamp(300px,30vw,520px);gap:clamp(20px,2.4vw,48px);align-items:start}
.sheet{border:1.5px solid var(--ink);padding:clamp(18px,2.2vw,40px) clamp(20px,2.6vw,50px) clamp(24px,2.6vw,50px)}
.essay p{margin:0 0 .7em;font-family:Kalam,cursive;color:var(--pen);font-size:clamp(20px,1.9vw,36px);line-height:2.35;text-indent:1.6em}
.m{position:relative;transition:background .15s}
.m.e.show{border-bottom:3px solid var(--blue)}
.m.g.show{border-bottom:3px dashed var(--blue)}
.m.sel{background:var(--neon)}
.tg{display:none;font-family:Caveat,cursive;font-weight:700;color:var(--blue);font-size:1.15em;line-height:0;vertical-align:.45em;margin:0 .2em 0 .1em;white-space:nowrap;cursor:pointer}
.tg.show{display:inline}
.tg i{font-style:normal;font-family:Inter;font-weight:800;font-size:.5em;color:#fff;background:var(--ink);padding:.2em .55em;border-radius:1em;margin-right:.4em;vertical-align:.25em}
.tg em{font-style:normal;color:var(--orange);margin-left:.3em}
.tg.sel i{background:var(--blue)}
.cut{display:none;border-left:3px solid var(--blue);margin:0 2px 0 3px}.cut.show{display:inline-block;height:1em;vertical-align:-.1em}
.m.show{cursor:pointer}
.panel{position:sticky;top:96px;max-height:calc(100vh - 110px);overflow:auto}
.card{border-top:2px solid var(--ink);padding:14px 0 6px}
.card .k{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.card .k b.n{font-size:clamp(34px,3.4vw,64px);font-weight:900;letter-spacing:-.03em;line-height:1}
.card .k .sy{font-family:Caveat,cursive;font-weight:700;color:var(--blue);font-size:clamp(36px,3.4vw,64px);line-height:1}
.card .k .sn{font-size:clamp(13px,1vw,18px);font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--mid)}
.card .tr{margin:12px 0 4px;font-size:clamp(17px,1.5vw,28px);font-weight:800;letter-spacing:-.01em}
.card .tk{margin:0;padding-left:16px;border-left:3px solid var(--blue);font-size:clamp(16px,1.35vw,24px);line-height:1.5;font-weight:500}
.hint{color:var(--mid);font-size:clamp(14px,1.1vw,19px);line-height:1.5;margin:0}
.nav{display:flex;gap:8px;margin:14px 0 4px}
.leg{margin-top:18px;border-top:1px solid var(--light);padding-top:10px;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:clamp(12px,.9vw,15px);color:var(--mid);font-weight:600}
.leg b{color:var(--ink);font-weight:900;margin-right:4px}
.sb{margin-top:22px;border-top:2px solid var(--ink)}
.sb h3{margin:12px 0 2px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mid)}
.sr{padding:12px 0;border-top:1px solid var(--light)}.sr:first-of-type{border-top:0}
.sr .t{display:flex;justify-content:space-between;align-items:baseline;gap:10px}.sr .t b{font-size:clamp(14px,1vw,17px);font-weight:800}
.sr .bn{display:inline-block;position:relative;margin-left:12px;min-width:30px;text-align:center;font-weight:900;font-size:clamp(15px,1.1vw,19px);color:var(--mid)}
.sr .bn.on{color:var(--blue);font-family:Caveat,cursive;font-size:clamp(26px,1.8vw,34px);line-height:1}
.sr .bn.on::after{content:"";position:absolute;inset:-4px -8px;border:2.4px solid var(--blue);border-radius:50%/60%;transform:rotate(-4deg)}
.sr .t>div{display:flex;align-items:baseline}
.tt{border-top:2px solid var(--ink);padding:12px 0;display:flex;justify-content:space-between;align-items:baseline;font-weight:900;font-size:clamp(15px,1.1vw,19px)}.tt .p{font-family:Caveat,cursive;font-weight:700;color:var(--blue);font-size:clamp(28px,2vw,38px);line-height:1}
.sr .p{font-family:Caveat,cursive;font-weight:700;color:var(--blue);font-size:clamp(22px,1.5vw,28px);line-height:1;white-space:nowrap}
.sr .e{font-size:clamp(12px,.9vw,15px);color:var(--mid);line-height:1.5;margin-top:3px}.sr .e b{color:var(--ink)}
.bar{position:relative;display:flex;height:24px;border:1.5px solid var(--ink);margin:9px 0 14px}
.bar .z{border-left:1px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--mid)}.bar .z:first-child{border-left:0}
.bar .mk{position:absolute;top:-8px;height:38px;border-left:3px solid var(--blue);transition:left .35s}
.bar .mk::after{content:"";position:absolute;left:-7px;top:-4px;width:11px;height:11px;border:2px solid var(--blue);border-radius:50%;background:#fff}
.bar .gh{position:absolute;top:30px;height:0;border-top:3px dashed var(--bad);transition:all .35s}

/* pontuação */
.crit{border-top:2px solid var(--ink)}
.cr{display:grid;grid-template-columns:clamp(180px,17vw,320px) clamp(70px,6vw,110px) minmax(0,1fr);gap:clamp(14px,2vw,40px);padding:18px 0 20px;border-bottom:1px solid var(--light);align-items:start}
.cr .nm{font-size:clamp(17px,1.5vw,28px);font-weight:900;letter-spacing:-.02em;line-height:1.1}.cr .nm span{display:block;font-size:.62em;font-weight:600;color:var(--mid);margin-top:4px}
.cr .bd{font-size:clamp(48px,5vw,96px);font-weight:900;letter-spacing:-.03em;line-height:1}
.cr .bd.q{color:#BDBDB8}
.cr p{margin:0 0 6px;font-size:clamp(15px,1.25vw,22px);line-height:1.5}.cr p.mc{font-size:clamp(13px,1vw,17px);color:var(--mid)}
.cr .rv{margin:0}
.cr.closed .why{display:none}
.tot{display:flex;align-items:baseline;gap:24px;padding:18px 0;border-bottom:2px solid var(--ink);flex-wrap:wrap}
.tot .nn{font-size:clamp(54px,6vw,110px);font-weight:900;letter-spacing:-.04em;line-height:1}
.tot .tt{font-size:clamp(22px,2.2vw,40px);font-weight:900;letter-spacing:-.02em}
.neon{background:var(--neon);padding:12px 18px;font-weight:800;font-size:clamp(16px,1.4vw,24px);margin-top:18px;line-height:1.4}
.box{border-left:4px solid var(--blue);padding:4px 0 4px 18px;margin-top:20px;font-size:clamp(15px,1.25vw,22px);line-height:1.55}
/* comentários */
.hand{font-family:Caveat,cursive;font-weight:700;color:var(--blue)}
.tc{border:1.5px solid var(--ink);padding:14px 22px}
.tc .r{display:grid;grid-template-columns:clamp(70px,7vw,120px) 1fr;gap:16px;padding:8px 0;border-top:1px solid var(--light);align-items:baseline}.tc .r:first-of-type{border-top:0}
.tc .r b{font-size:clamp(14px,1.1vw,19px);font-weight:800}
.tc .r .hand{font-size:clamp(26px,2.5vw,46px);line-height:1.15}
h2{font-size:clamp(22px,2vw,36px);font-weight:900;letter-spacing:-.02em;margin:34px 0 8px}
.mdl{border:1.5px solid var(--ink);padding:14px 22px;font-size:clamp(26px,2.5vw,46px);line-height:1.2}
.sem{font-size:clamp(15px,1.25vw,22px);line-height:1.55;color:var(--mid);margin:0 0 6px}
/* capa */
.cv{display:grid;grid-template-columns:minmax(300px,.42fr) 1fr;border-top:2px solid var(--ink);margin:0 -32px;min-height:70vh}
.cv .l{padding:30px 36px 30px 32px;border-right:2px solid var(--ink)}.cv .r{padding:30px 32px}
.cv h1{margin:8px 0 18px}
.cv .st{display:grid;grid-template-columns:34px 1fr;padding:10px 0;border-bottom:1px solid var(--light);font-size:clamp(15px,1.15vw,20px);font-weight:600;line-height:1.4}
.cv .st i{font-style:normal;font-weight:900;color:var(--orange);font-size:1.4em;line-height:1.1}
.cv .dls{display:grid;gap:8px;margin-top:8px}
.cv .dl{display:block;border:1.5px solid var(--ink);padding:11px 16px;font-weight:700;font-size:clamp(14px,1.05vw,18px);color:var(--ink);text-decoration:none;background:#fff}
.cv .dl:hover{background:#F4F4F1}
.cv .ccr{padding:16px 0;border-bottom:1px solid var(--light)}
.cv .ccr h3{font-size:clamp(20px,1.7vw,32px);font-weight:900;letter-spacing:-.02em;margin:0}.cv .ccr h3 span{font-size:.5em;font-weight:600;color:var(--mid);margin-left:10px;letter-spacing:0}
.cv .ccr .g{display:grid;grid-template-columns:1fr 1fr;column-gap:34px;margin-top:6px;font-size:clamp(14px,1.1vw,19px);line-height:1.45}
.cv .tag{font-size:clamp(30px,2.4vw,46px);margin:-2px 0 4px}
@media(max-width:900px){.cv{grid-template-columns:1fr;margin:0 -16px}.cv .l{border-right:0;border-bottom:2px solid var(--ink)}.cv .ccr .g{grid-template-columns:1fr}}
@media(max-width:900px){.grid{grid-template-columns:1fr}.panel{position:static}.cr{grid-template-columns:1fr}}

<script>
const D=[{"key": "T1-helena", "name": "Helena", "teens": 1, "cefr": "A1", "task": "should students wear a school uniform?", "sit": "Your school blog is asking students about the school day.", "words": 75, "count": 77, "essay": "<p>I think<span class=\"tg\" data-n=\"1\"><i>1</i>∧<em>it</em></span> is a good idea to <span class=\"m e\" data-n=\"2\">dress</span><span class=\"tg\" data-n=\"2\"><i>2</i>WW<em>wear</em></span> uniform in school.</p><p>First, <span class=\"m e\" data-n=\"3\">uniform</span><span class=\"tg\" data-n=\"3\"><i>3</i>#</span> is cheap. For example, my brother <span class=\"m e\" data-n=\"4\">have</span><span class=\"tg\" data-n=\"4\"><i>4</i>SVA</span> two <span class=\"m e\" data-n=\"5\">uniform</span><span class=\"tg\" data-n=\"5\"><i>5</i>#</span> and he <span class=\"m e\" data-n=\"6\">don’t</span><span class=\"tg\" data-n=\"6\"><i>6</i>SVA</span> buy many clothes. Yesterday my mother buy a shirt for me.</p><p>Second, <span class=\"m g\" data-n=\"7\">all students are</span><span class=\"tg\" data-n=\"7\"><i>7</i>!</span> equals. <span class=\"m g\" data-n=\"8\">For example</span><span class=\"tg\" data-n=\"8\"><i>8</i>✓</span>, my friend Bia has shoes new and I no have.</p><p><span class=\"m g\" data-n=\"9\">In conclusion</span><span class=\"tg\" data-n=\"9\"><i>9</i>✓</span>, I like the uniform because<span class=\"tg\" data-n=\"10\"><i>10</i>∧<em>it</em></span> is <span class=\"m e\" data-n=\"11\">confortable</span><span class=\"tg\" data-n=\"11\"><i>11</i>SP</span>. In the morning I put the <span class=\"m e\" data-n=\"12\">calça</span><span class=\"tg\" data-n=\"12\"><i>12</i>WW<em>pants</em></span> and the shirt and I go in school.</p>", "marks": [{"n": 1, "s": "∧", "tr": "“I think ∧ is”", "talk": "Falta o sujeito. Em inglês a frase precisa dele: “it”.", "kind": "e", "sn": "Falta uma palavra"}, {"n": 2, "s": "WW", "tr": "“to dress uniform”", "talk": "Com uniforme e roupa em geral o verbo é “wear”.", "kind": "e", "sn": "Palavra errada"}, {"n": 3, "s": "#", "tr": "“uniform is cheap”", "talk": "Aqui o natural é o plural: “uniforms are cheap”.", "kind": "e", "sn": "Singular ou plural"}, {"n": 4, "s": "SVA", "tr": "“brother have”", "talk": "Ele, ela e “my brother” pedem “has”.", "kind": "e", "sn": "Verbo e sujeito"}, {"n": 5, "s": "#", "tr": "“two uniform”", "talk": "Mais de um: “two uniforms”. O mesmo padrão da primeira frase.", "kind": "e", "sn": "Singular ou plural"}, {"n": 6, "s": "SVA", "tr": "“he don’t”", "talk": "Com “he”, o negativo é “doesn’t”. O mesmo padrão de “have”.", "kind": "e", "sn": "Verbo e sujeito"}, {"n": 7, "s": "!", "tr": "“all students are”", "talk": "Boa razão, curta e clara: todos iguais. A forma de “equal” é outra conversa.", "kind": "g", "sn": "Boa ideia"}, {"n": 8, "s": "✓", "tr": "“For example”", "talk": "Chunk da unidade, usado para abrir o exemplo.", "kind": "g", "sn": "Bom uso"}, {"n": 9, "s": "✓", "tr": "“In conclusion”", "talk": "Chunk certo para fechar o texto.", "kind": "g", "sn": "Bom uso"}, {"n": 10, "s": "∧", "tr": "“because ∧ is”", "talk": "Falta o sujeito de novo: “because it is”.", "kind": "e", "sn": "Falta uma palavra"}, {"n": 11, "s": "SP", "tr": "“confortable”", "talk": "Ortografia: “comfortable”.", "kind": "e", "sn": "Ortografia"}, {"n": 12, "s": "WW", "tr": "“the calça”", "talk": "Palavra em português: “pants”.", "kind": "e", "sn": "Palavra errada"}], "crit": [{"name": "Task and content", "sub": "O que o texto diz", "band": 3, "ps": ["As quatro partes existem. A opinião é clara (“I think … is a good idea”) e cada razão tem um exemplo. Os exemplos são curtos: o do irmão (“he don’t buy many clothes”) sustenta a economia, e o de Bia (“shoes new and I no have”) sustenta a igualdade só em parte. A conclusão acrescenta conforto e a rotina da manhã, e não só “I like the uniform”."], "mc": "Traço da faixa 3: todas as partes tentadas, exemplos curtos. O leitor, em geral, entende."}, {"name": "Organization and cohesion", "sub": "A ordem e a ligação", "band": 4, "ps": ["A ordem do checklist é seguida e cada parte começa em parágrafo próprio, com “First”, “Second”, “For example” e “In conclusion”. Dentro dos parágrafos, as ligações são as mais simples (“and”, “because”)."], "mc": "Entre as faixas 5 e 3: a ordem e o início visível das partes são da faixa 5; as ligações dentro dos parágrafos são as mais simples, da faixa 3. Faixa 4."}, {"name": "Vocabulary", "sub": "Palavras e ortografia", "band": 3, "ps": ["O vocabulário do tema é curto, mas dá para ler. Quatro escorregões: “dress” no lugar de “wear”, “calça” em português, “put the” no lugar de “put on” e “confortable” (ortografia). Em Vocabulary, 3 a 5 escorregões caem em “3 a 5”."], "mc": "Marcados: WW ×2, SP. Contado, sem marca: “put the” (“put on”)."}, {"name": "Grammar", "sub": "Estruturas e frases", "band": 3, "ps": ["Oito padrões, e o que se repete conta uma vez: sujeito que falta (“think is”, “because is”), plural (“uniform is”, “two uniform”), terceira pessoa (“brother have”, “he don’t”), tempo do verbo (“mother buy”), forma do adjetivo (“are equals”), negativo (“I no have”), ordem (“shoes new”) e preposição (“go in school”, que com destino é “go to school”). “Wear uniform”, sem artigo, fica fora da contagem: é uso idiomático do inglês britânico. O sentido nunca se perde. Em Grammar, oito caem em “4 a 8”."], "mc": "Marcados: ∧ ×2, SVA ×2, # ×2. Contados, sem marca: “mother buy”, “are equals”, “I no have”, “shoes new”, “go in school”."}], "total": 13, "nota": "6,5", "box": "Oito padrões é o limite de cima da faixa 3, e o sentido nunca se perde. Se outro professor der Grammar 2 pelo número de erros em 75 palavras, a nota vai a 6,0.", "sem": ["Cinco padrões não foram marcados porque as cinco categorias do limite já estavam usadas: o tempo do verbo (“my mother buy”), a forma de “equal” (“are equals”), o “I no have”, a ordem de “shoes new” e a preposição de “go in school”. Esta aluna ainda está no começo do verbo “be”. O que ela precisa levar desta correção são três hábitos: o sujeito antes do verbo, o plural e o “s” da terceira pessoa.", "Em “put the calça”, o “calça” foi marcado. O verbo também muda: “put on the pants”. É outro escorregão de Vocabulary, separado do primeiro, e ficou sem marca.", "“Wear uniform”, sem artigo, não foi marcado: é uso idiomático do inglês britânico (“students must wear uniform”)."], "gt": 8, "vt": 4, "gu": ["verbo no passado (“my mother buy” → “bought”)", "forma do adjetivo (“are equals” → “are equal”)", "negativo (“I no have” → “I don’t have”)", "ordem (“shoes new” → “new shoes”)", "preposição de destino (“go in school” → “go to school”)"], "vu": ["“put the” (“put on”)"], "comments": [{"l": "✓", "t": "You wrote four short parts and used First, Second, For example and In conclusion."}, {"l": "Focus", "t": "Say the subject before the verb: “I think it is …”. With he, she, my brother, check the verb."}, {"l": "Next", "t": "Rewrite your second paragraph. Check the plural and the verbs."}], "modelo": "First, uniforms are cheap. For example, my brother has two uniforms and he does not buy many clothes.", "fix": true, "ins": ["Write four short paragraphs, about 75 words.", "Give two reasons, each with an example.", "Finish with a conclusion."]}, {"key": "T2-marina", "name": "Marina", "teens": 2, "cefr": "A2", "task": "should schools have a longer break?", "sit": "Your school blog is asking students about the school day.", "words": 100, "count": 99, "essay": "<p><span class=\"m g\" data-n=\"1\">In my opinion</span><span class=\"tg\" data-n=\"1\"><i>1</i>✓</span>, schools should have a longer break because students <span class=\"m e\" data-n=\"2\">needs</span><span class=\"tg\" data-n=\"2\"><i>2</i>SVA</span> to rest.</p><p>First, a longer break <span class=\"m e\" data-n=\"3\">help</span><span class=\"tg\" data-n=\"3\"><i>3</i>SVA</span> students to relax. <span class=\"m g\" data-n=\"4\">For example</span><span class=\"tg\" data-n=\"4\"><i>4</i>✓</span>, my friend Lucas is very tired after math class, so he needs more time to eat and talk with friends.</p><p>Second, a longer break is <span class=\"m e\" data-n=\"5\">importent</span><span class=\"tg\" data-n=\"5\"><i>5</i>SP</span> for <span class=\"m e\" data-n=\"6\">the</span><span class=\"tg\" data-n=\"6\"><i>6</i>\\</span> sports. For example, my friend Bia plays soccer with her team, but <span class=\"m g\" data-n=\"7\">the break is only fifteen minutes</span><span class=\"tg\" data-n=\"7\"><i>7</i>!</span>,<span class=\"cut tg-cut\" data-n=\"8\"></span><span class=\"tg\" data-n=\"8\"><i>8</i>NS</span> they can’t finish the game.</p><p>In conclusion, schools should <span class=\"m e\" data-n=\"9\">make</span><span class=\"tg\" data-n=\"9\"><i>9</i>WW<em>have</em></span> a longer break. <span class=\"m g\" data-n=\"10\">As a result</span><span class=\"tg\" data-n=\"10\"><i>10</i>✓</span>, students will be more happy and they will <span class=\"m e\" data-n=\"11\">go</span><span class=\"tg\" data-n=\"11\"><i>11</i>WW<em>do</em></span> better in the tests.</p>", "marks": [{"n": 1, "s": "✓", "tr": "“In my opinion”", "talk": "Chunk da unidade, para dar a opinião logo no começo.", "kind": "g", "sn": "Bom uso"}, {"n": 2, "s": "SVA", "tr": "“students needs”", "talk": "Com “students”, o verbo fica sem “s”: “need”.", "kind": "e", "sn": "Verbo e sujeito"}, {"n": 3, "s": "SVA", "tr": "“break help”", "talk": "Com “a longer break”, o verbo leva “s”: “helps”.", "kind": "e", "sn": "Verbo e sujeito"}, {"n": 4, "s": "✓", "tr": "“For example”", "talk": "Chunk certo para abrir o exemplo.", "kind": "g", "sn": "Bom uso"}, {"n": 5, "s": "SP", "tr": "“importent”", "talk": "Ortografia: “important”.", "kind": "e", "sn": "Ortografia"}, {"n": 6, "s": "\\", "tr": "“for the sports”", "talk": "Falando de esporte em geral, sem “the”: “for sports”.", "kind": "e", "sn": "Tire o artigo"}, {"n": 7, "s": "!", "tr": "“the break is only fifteen minutes”", "talk": "Detalhe concreto, que prova a razão. É o melhor trecho do texto.", "kind": "g", "sn": "Boa ideia"}, {"n": 8, "s": "NS", "tr": "“minutes, they can’t”", "talk": "Duas ideias, duas frases: ponto aqui.", "kind": "e", "sn": "Nova frase"}, {"n": 9, "s": "WW", "tr": "“should make a longer break”", "talk": "A combinação natural é “have a longer break”.", "kind": "e", "sn": "Palavra errada"}, {"n": 10, "s": "✓", "tr": "“As a result”", "talk": "Conector de resultado, bem usado: mais pausa, alunos mais descansados.", "kind": "g", "sn": "Bom uso"}, {"n": 11, "s": "WW", "tr": "“go better”", "talk": "Para se sair melhor nas provas: “do better”.", "kind": "e", "sn": "Palavra errada"}], "crit": [{"name": "Task and content", "sub": "O que o texto diz", "band": 4, "ps": ["As quatro partes existem. A opinião é clara desde a primeira frase e as duas razões têm exemplo. O primeiro (“Lucas is very tired after math class”) é mais curto; o segundo, “the break is only fifteen minutes”, prova a razão."], "mc": "Entre as faixas 5 e 3: partes completas e um exemplo forte (faixa 5), um exemplo fino (faixa 3). Faixa 4."}, {"name": "Organization and cohesion", "sub": "A ordem e a ligação", "band": 4, "ps": ["Ordem do checklist, cada parte em parágrafo próprio e conectores que cumprem a função: “In my opinion”, “First”, “Second”, “For example”, “but”, “As a result”, “In conclusion”."], "mc": "Entre as faixas 5 e 3: ordem e início visível das partes (faixa 5); as ligações entre as ideias são as mais simples, mas corretas (faixa 3). Faixa 4."}, {"name": "Vocabulary", "sub": "Palavras e ortografia", "band": 3, "ps": ["Três escorregões: “make” no lugar de “have”, “go better” no lugar de “do better” e “importent” (ortografia). Os chunks da unidade estão todos lá (“In my opinion”, “For example”, “As a result”), mas o repertório não vai além deles."], "mc": "3 escorregões caem em “3 a 5”: faixa 3. Marcados: WW ×2, SP."}, {"name": "Grammar", "sub": "Estruturas e frases", "band": 3, "ps": ["Quatro padrões: concordância do verbo (“students needs”, “break help”), artigo (“for the sports”), frases emendadas por vírgula (“minutes, they can’t”) e forma do comparativo (“more happy”). Em Grammar, quatro caem em “4 a 8”. O sentido nunca se perde. “In the tests” fica fora da contagem: in e on variam conforme a variedade do inglês."], "mc": "Marcados: SVA ×2, \\, NS. Contado, sem marca: “more happy”."}], "total": 14, "nota": "7,0", "box": "Nenhum erro tira o sentido e os chunks da unidade estão todos no lugar, mas o repertório fica nele: Vocabulary 3. Se outro professor der Vocabulary 4 ou Organization 5, a nota vai a 7,5.", "sem": ["Uma coisa apareceu e não foi marcada: o comparativo de “more happy” (“happier”). Ele volta quando a unidade ensinar a forma certa ou se repetir em outros textos da aluna.", "“In the tests” não foi marcado nem contado: “in the tests” e “on the tests” são variantes, e “do better in tests” também serve."], "gt": 4, "vt": 3, "gu": ["forma do comparativo (“more happy” → “happier”)"], "vu": [], "comments": [{"l": "✓", "t": "Four clear parts, and “the break is only fifteen minutes” is a great example."}, {"l": "Focus", "t": "Check the verb after “students” and after “a longer break”."}, {"l": "Next", "t": "Rewrite the third paragraph and put a full stop after “minutes”."}], "modelo": "Second, a longer break is important for sports. For example, my friend Bia plays soccer with her team, but the break is only fifteen minutes. They can’t finish the game.", "fix": true, "ins": ["Write four paragraphs, about 100 words.", "Give two reasons, each with an example.", "Finish with a conclusion."]}, {"key": "T3-beatriz", "name": "Beatriz", "teens": 3, "cefr": "B1 (início)", "task": "should teenagers play video games every day?", "sit": "Your school blog is asking students about free time.", "words": 100, "count": 101, "essay": "<p><span class=\"m g\" data-n=\"1\">In my opinion</span><span class=\"tg\" data-n=\"1\"><i>1</i>✓</span>, teenagers should not play video games every day because it is bad for <span class=\"m e\" data-n=\"2\">the</span><span class=\"tg\" data-n=\"2\"><i>2</i>\\</span> health. <span class=\"tg\" data-n=\"3\"><i>3</i>NP ¶</span><span class=\"m e\" data-n=\"4\">The</span><span class=\"tg\" data-n=\"4\"><i>4</i>\\</span> video games make the teenagers sleep late and they are tired in <span class=\"m e\" data-n=\"5\">the</span><span class=\"tg\" data-n=\"5\"><i>5</i>\\</span> school in the morning,<span class=\"cut tg-cut\" data-n=\"6\"></span><span class=\"tg\" data-n=\"6\"><i>6</i>NS</span> <span class=\"m g\" data-n=\"7\">my brother plays until</span><span class=\"tg\" data-n=\"7\"><i>7</i>!</span> midnigth and he <span class=\"m e\" data-n=\"8\">sleep</span><span class=\"tg\" data-n=\"8\"><i>8</i>SVA</span> in class. <span class=\"tg\" data-n=\"9\"><i>9</i>NP ¶</span>Also, they don’t make the homework and their grades are lower. My cousin is a good student but actually he is playing a lot and his grades <span class=\"m e\" data-n=\"10\">is</span><span class=\"tg\" data-n=\"10\"><i>10</i>SVA</span> bad. Video games are fun when you play with friends. <span class=\"m g\" data-n=\"11\">However</span><span class=\"tg\" data-n=\"11\"><i>11</i>✓</span>, if you play every day<span class=\"tg\" data-n=\"12\"><i>12</i>∧</span> is not good. <span class=\"tg\" data-n=\"13\"><i>13</i>NP ¶</span>So, I think the parents must control this.</p>", "marks": [{"n": 1, "s": "✓", "tr": "“In my opinion”", "talk": "Chunk da unidade, e a opinião é clara.", "kind": "g", "sn": "Bom uso"}, {"n": 2, "s": "\\", "tr": "“for the health”", "talk": "Sem artigo: “bad for health” (ou “for your health”).", "kind": "e", "sn": "Tire o artigo"}, {"n": 3, "s": "NP", "tr": "“health. The video games”", "talk": "Aqui começa a primeira razão: parágrafo novo.", "kind": "e", "sn": "Novo parágrafo"}, {"n": 4, "s": "\\", "tr": "“The video games”", "talk": "Falando de jogos em geral, sem artigo: “Video games make …”.", "kind": "e", "sn": "Tire o artigo"}, {"n": 5, "s": "\\", "tr": "“in the school”", "talk": "Sem artigo: “in school” ou “at school”.", "kind": "e", "sn": "Tire o artigo"}, {"n": 6, "s": "NS", "tr": "“morning, my brother”", "talk": "Duas ideias, duas frases: ponto aqui.", "kind": "e", "sn": "Nova frase"}, {"n": 7, "s": "!", "tr": "“my brother plays until …”", "talk": "Exemplo da vida dela, concreto. É o melhor trecho do texto.", "kind": "g", "sn": "Boa ideia"}, {"n": 8, "s": "SVA", "tr": "“he sleep”", "talk": "Com “he”, o verbo leva “s”: “sleeps”.", "kind": "e", "sn": "Verbo e sujeito"}, {"n": 9, "s": "NP", "tr": "“class. Also,”", "talk": "Aqui começa a segunda razão: parágrafo novo.", "kind": "e", "sn": "Novo parágrafo"}, {"n": 10, "s": "SVA", "tr": "“grades is”", "talk": "“Grades” é plural: “are”. O mesmo padrão de “he sleep”.", "kind": "e", "sn": "Verbo e sujeito"}, {"n": 11, "s": "✓", "tr": "“However,”", "talk": "Conector certo, abrindo frase nova com vírgula.", "kind": "g", "sn": "Bom uso"}, {"n": 12, "s": "∧", "tr": "“every day ∧ is not good”", "talk": "Falta o sujeito: “it is not good”.", "kind": "e", "sn": "Falta uma palavra"}, {"n": 13, "s": "NP", "tr": "“good. So,”", "talk": "Aqui fecha o texto: parágrafo novo.", "kind": "e", "sn": "Novo parágrafo"}], "crit": [{"name": "Task and content", "sub": "O que o texto diz", "band": 3, "ps": ["A opinião é clara e as duas razões têm exemplo (o irmão, o primo). Há até uma concessão (“Video games are fun when you play with friends. However…”). Mas a conclusão traz uma recomendação nova (“the parents must control this”) e não retoma a opinião."], "mc": "Traço da faixa 3: uma parte fina, no caso a conclusão, que não retoma a opinião. O leitor entende."}, {"name": "Organization and cohesion", "sub": "A ordem e a ligação", "band": 2, "ps": ["O texto inteiro é um bloco só, sem separação entre opinião, razões e conclusão. Os conectores existem (“because”, “Also”, “but”, “However”, “So”), mas o leitor não vê onde cada parte começa. Marcamos NP três vezes."], "mc": "Entre as faixas 3 e 1: conectores básicos e uma ordem possível de seguir (faixa 3), sem nenhuma separação visual (faixa 1). Faixa 2."}, {"name": "Vocabulary", "sub": "Palavras e ortografia", "band": 3, "ps": ["O vocabulário do tema serve (“video games”, “grades”). Três escorregões: “make the homework” (por “do homework”), “midnigth” (ortografia) e “sleep late” (que é dormir até tarde de manhã; ela quis dizer “stay up late”). Em Vocabulary, 3 caem em “3 a 5”."], "mc": "Contados, sem marca: “make the homework”, “midnigth”, “sleep late”."}, {"name": "Grammar", "sub": "Estruturas e frases", "band": 3, "ps": ["Quatro padrões: artigo (“for the health”, “The video games”, “in the school”, mais “the teenagers”, sem marca), concordância do verbo (“he sleep”, “grades is”), frases emendadas por vírgula (“morning, my brother”) e sujeito que falta (“every day is not good”). Em Grammar, quatro caem em “4 a 8”. O sentido nunca se perde."], "mc": "Marcados: \\ ×3, SVA ×2, NS, ∧. Também no padrão do artigo, sem marca: “the teenagers”."}], "total": 11, "nota": "5,5", "box": "A mesma aluna, com três quebras de parágrafo, passaria Organization de 2 para 4 e a nota de 5,5 para 6,5. Marcar NP é o que o professor mais pode fazer por este texto.", "sem": ["“The teenagers” não foi marcado: o padrão do artigo já aparece três vezes marcado, e a aluna precisa achar o outro. “Make the homework” (“do homework”), a ortografia de “midnigth” e “sleep late” (“stay up late”) entraram na contagem de Vocabulary. A vírgula depois de “if you play every day” também ficou sem marca.", "“Actually” (“na verdade”) está certo e não foi contado como erro. Só seria erro se ela quisesse dizer “agora”; nesse caso, “now” ou “currently”."], "gt": 4, "vt": 3, "gu": [], "vu": ["“make the homework” (“do homework”)", "“midnigth” (“midnight”)", "“sleep late” (“stay up late”)"], "comments": [{"l": "✓", "t": "You gave a clear opinion, and your brother is a real example."}, {"l": "Focus", "t": "Start a new paragraph for each reason, and do not use “the” before general things."}, {"l": "Next", "t": "Rewrite the text in four paragraphs. End by saying your opinion again."}], "modelo": "In conclusion, I think teenagers should not play video games every day, because they sleep less and do worse at school.", "fix": false, "ins": ["Write four paragraphs, about 100 words.", "Give two reasons, each with an example.", "Finish with a conclusion."]}, {"key": "T4-julia", "name": "Júlia", "teens": 4, "cefr": "B1", "task": "should students use their phones in class?", "sit": "Your school blog is asking students about technology at school.", "words": 150, "count": 154, "essay": "<p>In my opinion, <span class=\"m e\" data-n=\"1\">I think</span><span class=\"tg\" data-n=\"1\"><i>1</i>UR</span> students should be allowed to use their phones in class, but only for school activities.</p><p>First, phones are very useful tools for learning in diferent subjects. <span class=\"m g\" data-n=\"2\">For example</span><span class=\"tg\" data-n=\"2\"><i>2</i>✓</span>, <span class=\"m g\" data-n=\"3\">my friend Rafa uses a dictionary app</span><span class=\"tg\" data-n=\"3\"><i>3</i>!</span> when he does not understand a word, so he does not need to interrupt the teacher. He can also make a quick research and find a lot of <span class=\"m e\" data-n=\"4\">informations</span><span class=\"tg\" data-n=\"4\"><i>4</i>#</span> in seconds.</p><p>Second, phones help students to organize their time. For instance, Bia <span class=\"m e\" data-n=\"5\">write</span><span class=\"tg\" data-n=\"5\"><i>5</i>SVA</span> her homework in a calendar app, and she never forgets a deadline. Of course, some students get distracted, so it <span class=\"m e\" data-n=\"6\">depends of</span><span class=\"tg\" data-n=\"6\"><i>6</i>Prep</span> the rules of each school.</p><p><span class=\"m g\" data-n=\"7\">In conclusion</span><span class=\"tg\" data-n=\"7\"><i>7</i>✓</span>, I believe that phones should be allowed in the classroom, as long as the teacher <span class=\"m e\" data-n=\"8\">control</span><span class=\"tg\" data-n=\"8\"><i>8</i>SVA</span> how students use them. This way, students can be more responsable, and when they <span class=\"m e\" data-n=\"9\">will be</span><span class=\"tg\" data-n=\"9\"><i>9</i>VT</span> older, they will already know how to use technology well.</p>", "marks": [{"n": 1, "s": "UR", "tr": "“In my opinion, I think”", "talk": "A frase está correta, mas diz a opinião duas vezes. Fique com uma.", "kind": "e", "sn": "Repetição"}, {"n": 2, "s": "✓", "tr": "“For example”", "talk": "Conector certo para abrir o exemplo.", "kind": "g", "sn": "Bom uso"}, {"n": 3, "s": "!", "tr": "“my friend Rafa uses a dictionary app”", "talk": "Exemplo concreto, que prova a razão.", "kind": "g", "sn": "Boa ideia"}, {"n": 4, "s": "#", "tr": "“informations”", "talk": "Neste sentido, “information” não tem plural: “a lot of information”.", "kind": "e", "sn": "Singular ou plural"}, {"n": 5, "s": "SVA", "tr": "“Bia write”", "talk": "Com “Bia”, o verbo leva “s”: “writes”.", "kind": "e", "sn": "Verbo e sujeito"}, {"n": 6, "s": "Prep", "tr": "“depends of”", "talk": "A preposição é “on”: “depends on”.", "kind": "e", "sn": "Preposição"}, {"n": 7, "s": "✓", "tr": "“In conclusion”", "talk": "Abre a conclusão; a frase seguinte retoma a opinião.", "kind": "g", "sn": "Bom uso"}, {"n": 8, "s": "SVA", "tr": "“teacher control”", "talk": "Com “the teacher”, o verbo leva “s”: “controls”.", "kind": "e", "sn": "Verbo e sujeito"}, {"n": 9, "s": "VT", "tr": "“when they will be older”", "talk": "Em oração de tempo sobre o futuro, “when” pede o presente: “when they are older”.", "kind": "e", "sn": "Tempo do verbo"}], "crit": [{"name": "Task and content", "sub": "O que o texto diz", "band": 5, "ps": ["As quatro partes estão completas. A opinião tem uma condição (“only for school activities”), cada razão tem exemplo concreto (“Rafa uses a dictionary app”, “Bia … her homework in a calendar app”) e a conclusão retoma a opinião com outras palavras. O leitor fica plenamente informado."], "mc": "Descritor da faixa 5 inteiro."}, {"name": "Organization and cohesion", "sub": "A ordem e a ligação", "band": 4, "ps": ["Ordem do checklist e cada parte em parágrafo próprio, com conectores que cumprem a função (“First”, “Second”, “For example”, “For instance”, “so”, “as long as”, “This way”). Dois detalhes pequenos: “In my opinion, I think” repete a opinião, e a concessão “Of course, some students get distracted” é curta e poderia ser mais desenvolvida."], "mc": "Faixa 5 quase inteira; os dois detalhes pequenos tiram a faixa 5. Faixa 4."}, {"name": "Vocabulary", "sub": "Palavras e ortografia", "band": 4, "ps": ["Chunks bons (“be allowed to”, “as long as”, “get distracted”, “interrupt the teacher”). Três escorregões: “diferent” e “responsable” (ortografia) e “make a quick research” (por “do some quick research”). Em Vocabulary, 3 caem em “3 a 5”, mas o repertório puxa o texto para cima: faixa 4."], "mc": "Contados, sem marca: “diferent”, “make a quick research”, “responsable”."}, {"name": "Grammar", "sub": "Estruturas e frases", "band": 3, "ps": ["Quatro padrões: substantivo incontável (“informations”, “a quick research”), concordância do verbo (“Bia write”, “teacher control”), preposição (“depends of”) e tempo depois de “when” (“when they will be”). Quatro é o limite de baixo da faixa 3. As estruturas (“as long as”, “so”, a oração com “when” correta em “when he does not understand a word”) estão certas, mas são as esperadas em B1 e não puxam o texto para a faixa 4. O sentido nunca se perde."], "mc": "Marcados: #, SVA ×2, Prep, VT. Também no padrão de incontável, sem marca: “a quick research”."}], "total": 16, "nota": "8,0", "box": "Quatro padrões de gramática ficam no limite de baixo da faixa 3, e as estruturas certas são as esperadas para B1. Se outro professor der Grammar 4 ou Organization 5, a nota vai a 8,5.", "sem": ["A ortografia de “diferent” e “responsable” e o “make a quick research” não foram marcados porque as cinco categorias do limite já estavam marcadas. Os três entraram n function viewS(d){
 const op=opened[d.key]||(opened[d.key]=new Set());
 let rows=d.crit.map((c,i)=>{const o=allMode||op.has(i);return `<div class="cr ${o?'':'closed'}" data-i="${i}"><div class="nm">${c.name}<span>${c.sub}</span></div><div class="bd ${o?'':'q'}">${o?c.band:'?'}</div><div>${o?`<div class="why">${c.ps.map(p=>`<p>${esc(p)}</p>`).join('')}<p class="mc">${esc(c.mc)}</p></div>`:`<button class="rv" data-i="${i}" aria-label="Mostrar a faixa de ${c.name}">Mostrar a faixa</button>`}</div></div>`}).join('');
 const done=allMode||op.size==4;
 return `<div class="views" style="margin-top:0"><button id="rall" aria-pressed="${allMode}">Mostrar tudo</button><span class="hint">Peça a faixa de cada critério à turma antes de revelar.</span></div>
 <div class="crit">${rows}</div>
 <div class="tot"><div class="nn">${done?d.total:'?'}</div><div class="tt">${done?`${d.total} ÷ 2 = ${d.nota} de 10`:'Total e nota de 10'}</div></div>
 ${done?`<div class="box"><b>Para o professor.</b> ${esc(d.box)} Uma faixa de diferença em um critério mexe 0,5 ponto.</div>`:''}`;
}
function bindS(d){
 const op=opened[d.key];
 document.querySelectorAll('.rv').forEach(b=>b.onclick=()=>{op.add(+b.dataset.i);render()});
 $('#rall').onclick=()=>{allMode=!allMode;render()};
}
function viewC(d){
 return `<div class="tc"><div class="eyebrow" style="margin-bottom:4px">Teacher’s comments · como escrever na folha</div>${d.comments.map(c=>`<div class="r"><b>${esc(c.l)}</b><div class="hand">${esc(c.t)}</div></div>`).join('')}</div>
 <h2>Sem marca, de propósito</h2>${d.sem.map(s=>`<p class="sem">${esc(s)}</p>`).join('')}
 <h2>Modelo para a reescrita</h2><div class="mdl hand">${esc(d.modelo)}</div>`;
}
$('#stu').innerHTML='<button data-i="-1">Cover<small>Read first</small></button>'+D.map((d,i)=>`<button data-i="${i}">Teens ${d.teens}<small>${d.name} · ${d.cefr}</small></button>`).join('');
document.querySelectorAll('#stu button').forEach(b=>b.onclick=()=>{si=+b.dataset.i;shown=0;sel=0;view='t';allMode=false;delete opened[D[si]?.key];render();scrollTo(0,0)});
document.querySelectorAll('.views button[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v;render()});
$('#fs').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()};
document.addEventListener('keydown',e=>{
 if(e.ctrlKey||e.metaKey||e.altKey||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.isContentEditable)return;
 if(e.target.tagName=='BUTTON'&&e.key==' ')return;
 if(si>=0&&view=='t'){
  const d=D[si],n=d.marks.length;
  if(e.key=='ArrowRight'){shown=Math.min(n,Math.max(shown,sel+1));sel=Math.min(n,sel+1);window._upd&&window._upd();e.preventDefault()}
  if(e.key=='ArrowLeft'){sel=Math.max(0,sel-1);window._upd&&window._upd();e.preventDefault()}
 }
 if(si>=0){if(e.key=='1')view='t',render();if(e.key=='2')view='s',render();if(e.key=='3')view='c',render();}
});
render();
</script></body></html>
