<!--
  =====================================================================
  EIC · Before It Breaks · NAVBAR DO MÓDULO  (snippet reaproveitável)
  =====================================================================

  COMO USAR EM QUALQUER PÁGINA DO CLUSTER

  1. Cole o bloco CSS marcado abaixo no fim da folha de estilo existente.
  2. Cole o botão .mn-open dentro do <div class="hdr-right">, antes do badge B1+.
  3. Cole o bloco do drawer, marcado abaixo, logo antes do fechamento do body.

  A página atual se marca sozinha, comparando o nome do arquivo na URL.
  Não precisa configurar nada por página.

  PARA MUDAR OS ITENS: edite só o array NAV lá embaixo. Ele é a única
  fonte da lista. Depois de ajustar, replique o mesmo bloco nas demais.

  ATENÇÃO: os rótulos abaixo são meu palpite a partir do nome dos
  arquivos. Corrija os que estiverem errados e me devolva a lista
  certa que eu propago.
  =====================================================================
-->


<!-- MN-CSS-START -->
<style>
.mn-open{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);
  color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;padding:0;transition:background .15s ease}
.mn-open:hover{background:rgba(255,255,255,.18)}
.mn-veil{position:fixed;inset:0;background:rgba(7,16,32,.62);z-index:300;opacity:0;pointer-events:none;transition:opacity .26s ease}
.mn-veil.on{opacity:1;pointer-events:auto}
.mn{position:fixed;top:0;right:0;bottom:0;width:352px;max-width:86vw;background:#071020;z-index:310;
  transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
.mn.on{transform:translateX(0)}
.mn-top{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;flex:none;border-bottom:1px solid rgba(255,255,255,.08)}
.mn-top b{font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.5)}
.mn-x{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.1);border:none;color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex:none;padding:0}
.mn-body{flex:1;overflow-y:auto;padding:20px 22px 40px}
.mn-grp{font-size:9.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#E8621A;margin:22px 0 8px}
.mn-grp:first-child{margin-top:0}
.mn-a{display:flex;align-items:center;gap:11px;padding:9px 0;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.06);
  opacity:0;transform:translateX(16px);transition:opacity .3s ease,transform .3s ease}
.mn.on .mn-a{opacity:1;transform:translateX(0)}
.mn-n{font-size:9.5px;font-weight:800;color:rgba(255,255,255,.28);min-width:17px;flex:none;letter-spacing:.04em}
.mn-t{font-size:13.5px;font-weight:600;color:rgba(255,255,255,.72);line-height:1.4;transition:color .15s ease}
.mn-a:hover .mn-t{color:#fff}
.mn-a.here{border-bottom-color:rgba(245,255,0,.3)}
.mn-a.here .mn-t{color:#F5FF00;font-weight:800}
.mn-a.here .mn-n{color:#F5FF00}
.mn-dot{width:5px;height:5px;border-radius:50%;background:#F5FF00;margin-left:auto;flex:none}
.mn-foot{padding:16px 22px;border-top:1px solid rgba(255,255,255,.08);font-size:10.5px;line-height:1.6;color:rgba(255,255,255,.25);flex:none}
</style>


<!-- MN-CSS-END -->

<!-- MN-BTN-START -->
<button class="mn-open" onclick="mnOpen()" aria-label="Abrir navegação do módulo">
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
</button>


<!-- MN-BTN-END -->

<!-- MN-DRAWER-START -->
<div class="mn-veil" id="mnVeil" onclick="mnClose()"></div>
<aside class="mn" id="mn">
  <div class="mn-top">
    <b>Before It Breaks</b>
    <button class="mn-x" onclick="mnClose()" aria-label="Fechar">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="mn-body" id="mnBody"></div>
  <div class="mn-foot">Ventix Compressors e Northwind HQ são empresas fictícias.</div>
</aside>

<script>
/* ---- única coisa a editar: a lista ---- */
var MN_HERE = "";                          /* arquivos nesta mesma pasta */
var MN_MAIN = "../before-it-breaks-full/"; /* pasta do resto do modulo   */
var NAV = [
  ["Start", [
    ["maint-lead-in.html", "Lead-in", false]
  ]],
  ["The ground", [
    ["maint-facility.html", "The Facility", false],
    ["maint-stakeholders.html", "Stakeholder Map", false],
    ["maint-documents.html", "Documents", false],
    ["maint-stage-map.html", "Stage Map", false]
  ]],
  ["Language", [
    ["maint-grammar.html", "Grammar", false],
    ["maint-grammar-conditional.html", "Conditionals", false],
    ["maint-grammar-supposed-to.html", "Supposed To", false],
    ["maint-grammar-deduction.html", "Deduction", false],
    ["maint-grammar-deduction-continuous.html", "Deduction Continuous", false],
    ["maint-deduction-practice.html", "Deduction Practice", false]
  ]],
  ["In action", [
    ["maint-scenes.html", "Scenes", false],
    ["closing-deal-deduction.html", "Closing the Deal", false],
    ["ventix-service-ladder.html", "Service Ladder", false]
  ]],
  ["Contract files", [
    ["ventix-policy-hub.html", "The Contract Files", true],
    ["ventix-fine-print.html", "Section 4 · The Fine Print", true],
    ["ventix-service-plan.html", "Exhibit B · The Service Plan", true]
  ]]
];

(function buildNav(){
  var here = (location.pathname.split("/").pop() || "").toLowerCase();
  var n = 0, html = "";
  NAV.forEach(function(grp){
    html += '<div class="mn-grp">' + grp[0] + '</div>';
    grp[1].forEach(function(it){
      n++;
      var on = it[0].toLowerCase() === here;
      html += '<a class="mn-a' + (on ? ' here' : '') + '" href="' + (it[2] ? MN_HERE : MN_MAIN) + it[0] + '"'
            + ' style="transition-delay:' + (n * 26) + 'ms">'
            + '<span class="mn-n">' + (n < 10 ? "0" + n : n) + '</span>'
            + '<span class="mn-t">' + it[1] + '</span>'
            + (on ? '<span class="mn-dot"></span>' : '')
            + '</a>';
    });
  });
  document.getElementById("mnBody").innerHTML = html;
})();

function mnOpen(){
  document.getElementById("mn").classList.add("on");
  document.getElementById("mnVeil").classList.add("on");
  document.body.style.overflow = "hidden";
}
function mnClose(){
  document.getElementById("mn").classList.remove("on");
  document.getElementById("mnVeil").classList.remove("on");
  document.body.style.overflow = "";
}
document.addEventListener("keydown", function(e){ if(e.key === "Escape") mnClose(); });
</script>
<!-- MN-DRAWER-END -->
