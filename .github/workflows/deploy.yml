# Publica o site no Firebase Hosting a cada push no main.
# O hub (public/hub.html) é gerado aqui, pelo predeploy do firebase.json.
# Sem chave guardada: o GitHub se identifica no Google por Workload Identity Federation
# (a política da organização bloqueia a criação de chaves de conta de serviço).
name: Deploy Firebase Hosting

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'public-familia/**'
      - 'firebase.json'
      - '.firebaserc'
      - 'generate-hub.cjs'
  workflow_dispatch:

# Um deploy por vez; se chegar outro push, espera o atual terminar.
concurrency:
  group: deploy-hosting
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # o hub usa o histórico do git para datar cada material

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Entrar no Google sem chave (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/671300791274/locations/global/workloadIdentityPools/github/providers/eic-workbooks
          service_account: github-deploy@eic-worksheets.iam.gserviceaccount.com

      - name: Deploy (worksheets e familia)
        run: npx --yes firebase-tools@13 deploy --only hosting:worksheets,hosting:familia --project eic-worksheets --non-interactive
